<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --green1:#f0f7f0;--green2:#d4ead4;--green3:#a8d5a8;--green4:#6ab36a;--green5:#3d8b3d;
  --yellow1:#fefdf0;--yellow2:#fdf6d0;--yellow3:#f9eca0;--yellow4:#f0d040;--yellow5:#c8a800;
  --white:#ffffff;--text1:#1a2e1a;--text2:#3a5c3a;--text3:#6a8c6a;--cream:#fafcf5;
}
body{font-family:'DM Sans',sans-serif;background:var(--cream);color:var(--text1);}
h1,h2,h3,h4{font-family:'Cormorant Garamond',serif;}
::-webkit-scrollbar{width:6px;}
::-webkit-scrollbar-track{background:var(--green1);}
::-webkit-scrollbar-thumb{background:var(--green3);border-radius:3px;}
.btn-primary{background:var(--green4);color:#fff;border:none;border-radius:24px;padding:10px 28px;font-family:'DM Sans',sans-serif;font-size:14px;cursor:pointer;transition:all .2s;letter-spacing:.3px;}
.btn-primary:hover{background:var(--green5);transform:translateY(-1px);}
.btn-secondary{background:transparent;color:var(--green5);border:1.5px solid var(--green4);border-radius:24px;padding:9px 24px;font-family:'DM Sans',sans-serif;font-size:14px;cursor:pointer;transition:all .2s;}
.btn-secondary:hover{background:var(--green1);}
input,textarea,select{font-family:'DM Sans',sans-serif;font-size:14px;border:1.5px solid var(--green2);border-radius:10px;padding:10px 14px;width:100%;outline:none;background:white;color:var(--text1);transition:border-color .2s;}
input:focus,textarea:focus,select:focus{border-color:var(--green4);}
.card{background:white;border-radius:16px;border:1px solid var(--green2);padding:20px;}
.tag{display:inline-block;font-size:11px;padding:3px 10px;border-radius:12px;background:var(--green1);color:var(--green5);font-weight:500;letter-spacing:.3px;}
.fade-in{animation:fadeIn .4s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;z-index:1000;}
.modal{background:white;border-radius:20px;padding:28px;max-width:520px;width:90%;max-height:90vh;overflow-y:auto;}
/* Layout */
#app{display:flex;min-height:100vh;}
#sidebar{width:220px;min-height:100vh;background:white;border-right:1px solid var(--green2);display:flex;flex-direction:column;padding:24px 0;position:sticky;top:0;height:100vh;overflow-y:auto;}
#main{flex:1;overflow-y:auto;}
#topbar{background:white;border-bottom:1px solid var(--green2);padding:14px 36px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100;}
#page-content{min-height:calc(100vh - 53px);}
/* Sidebar */
.sidebar-logo{padding:0 20px 24px;border-bottom:1px solid var(--green2);}
.sidebar-logo .label{font-size:11px;color:var(--text3);letter-spacing:1px;text-transform:uppercase;margin-bottom:4px;}
.sidebar-logo h2{font-family:'Cormorant Garamond',serif;font-size:18px;color:var(--green5);font-weight:600;line-height:1.2;}
.sidebar-logo .sub{font-size:10px;color:var(--text3);margin-top:2px;}
.nav-area{flex:1;padding:16px 12px;}
.nav-btn{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border-radius:10px;border:none;cursor:pointer;background:transparent;color:var(--text2);font-family:'DM Sans',sans-serif;font-size:13px;font-weight:400;margin-bottom:2px;text-align:left;transition:all .15s;}
.nav-btn.active,.nav-btn:hover{background:var(--green1);color:var(--green5);}
.nav-btn.active{font-weight:500;}
.nav-icon{font-size:15px;}
.sidebar-user{padding:16px 20px;border-top:1px solid var(--green2);}
.sidebar-user .login-as{font-size:12px;color:var(--text3);margin-bottom:4px;}
.sidebar-user .uname{font-size:13px;font-weight:500;color:var(--text1);margin-bottom:2px;}
.sidebar-user .urole{font-size:11px;color:var(--text3);margin-bottom:10px;text-transform:capitalize;}
.sidebar-user button{font-size:12px;color:var(--text3);background:none;border:none;cursor:pointer;padding:0;}
/* Landing */
#landing{min-height:100vh;background:linear-gradient(160deg,var(--green1) 0%,var(--yellow1) 50%,white 100%);display:flex;flex-direction:column;}
.landing-counter{text-align:center;padding:12px 20px;background:rgba(255,255,255,.7);backdrop-filter:blur(10px);border-bottom:1px solid var(--green2);font-size:13px;color:var(--text3);}
.landing-body{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 20px;}
.landing-grid{display:grid;grid-template-columns:1fr 1fr;gap:60px;max-width:900px;width:100%;align-items:center;}
.landing-title{font-family:'Cormorant Garamond',serif;font-size:48px;color:var(--text1);line-height:1.15;margin-bottom:16px;}
.landing-desc{font-size:14.5px;color:var(--text2);line-height:1.9;margin-bottom:24px;}
.landing-tags{display:flex;flex-wrap:wrap;gap:8px;}
.landing-tag{font-size:12px;padding:4px 12px;border-radius:12px;background:white;border:1px solid var(--green3);color:var(--green5);}
.login-box{background:white;border-radius:24px;padding:36px 32px;box-shadow:0 4px 40px rgba(61,139,61,.1);border:1px solid var(--green2);}
.login-box h3{font-family:'Cormorant Garamond',serif;font-size:22px;color:var(--text1);margin-bottom:6px;}
.login-box p{font-size:13px;color:var(--text3);margin-bottom:24px;}
.form-label{font-size:12px;color:var(--text3);display:block;margin-bottom:6px;}
.role-option{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:10px;border:1.5px solid var(--green2);background:white;cursor:pointer;transition:all .15s;text-transform:capitalize;margin-bottom:8px;font-family:'DM Sans',sans-serif;font-size:13px;color:var(--text2);}
.role-option.selected{border-color:var(--green4);background:var(--green1);color:var(--green5);font-weight:500;}
.role-option input[type=radio]{width:auto;margin:0;border:none;padding:0;}
.error-box{font-size:12px;color:#c0392b;margin-bottom:12px;padding:8px 12px;background:#ffeaea;border-radius:8px;}
.landing-footer{text-align:center;padding:20px;font-size:12px;color:var(--text3);border-top:1px solid var(--green2);}
/* Beranda */
.quote-box{background:linear-gradient(135deg,var(--yellow1),var(--yellow2));border:1px solid var(--yellow3);border-radius:16px;padding:24px 28px;margin-bottom:28px;position:relative;overflow:hidden;}
.quote-label{font-size:11px;color:var(--yellow5);letter-spacing:1px;text-transform:uppercase;margin-bottom:10px;}
.quote-text{font-family:'Cormorant Garamond',serif;font-size:22px;color:var(--text1);line-height:1.5;margin-bottom:10px;font-style:italic;}
.quote-author{font-size:12px;color:var(--text3);}
.quote-dots{display:flex;gap:6px;margin-top:14px;}
.quote-dot{height:6px;border-radius:3px;border:none;cursor:pointer;transition:all .2s;background:var(--yellow3);}
.quote-dot.active{width:20px;background:var(--yellow5);}
.quote-dot:not(.active){width:6px;}
.vis-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.vis-card{background:var(--green1);border-radius:12px;padding:14px 16px;}
.vis-card-label{font-size:11px;color:var(--green5);font-weight:500;letter-spacing:1px;text-transform:uppercase;margin-bottom:6px;}
.vis-card-text{font-size:13px;color:var(--text2);line-height:1.7;}
/* Modul */
.module-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;}
.mod-card{cursor:pointer;transition:all .2s;padding:0!important;}
.mod-card:hover{transform:translateY(-3px);box-shadow:0 6px 20px rgba(0,0,0,.08);}
.mod-cover{width:100%;height:100px;border-radius:10px 10px 0 0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:26px;position:relative;}
.mod-cover-label{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.2);color:white;font-size:9px;text-align:center;padding:3px;text-transform:uppercase;letter-spacing:.3px;}
.mod-info{padding:8px 10px;}
.mod-name{font-size:11px;font-weight:500;color:var(--text1);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:2px;}
.mod-count{font-size:10px;color:var(--text3);}
/* Breadcrumb */
.breadcrumb{display:flex;align-items:center;gap:12px;margin-bottom:24px;}
.back-btn{background:none;border:none;cursor:pointer;color:var(--green5);font-size:14px;font-family:'DM Sans',sans-serif;}
.bread-sep{color:var(--text3);}
.bread-text{font-size:12px;color:var(--text3);}
/* Page header */
.page-header{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:28px;}
.page-title{font-family:'Cormorant Garamond',serif;font-size:30px;color:var(--green5);}
.page-sub{font-size:14px;color:var(--text3);}
/* Sub modul grid */
.sub-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.sub-card{cursor:pointer;transition:all .2s;}
.sub-card:hover{border-color:var(--green3)!important;}
.sub-name{font-family:'Cormorant Garamond',serif;font-size:17px;color:var(--text1);margin-bottom:4px;}
.sub-count{font-size:12px;color:var(--text3);}
/* Materi list */
.materi-card{cursor:pointer;transition:all .2s;margin-bottom:12px;}
.materi-card:hover{border-color:var(--green3)!important;}
.materi-title{font-family:'Cormorant Garamond',serif;font-size:18px;color:var(--text1);margin-bottom:4px;}
.materi-date{font-size:12px;color:var(--text3);margin-bottom:8px;}
.materi-excerpt{font-size:13px;color:var(--text2);line-height:1.7;}
.read-more{margin-top:10px;font-size:12px;color:var(--green5);}
/* Forum */
.forum-q{border-bottom:1px solid var(--green2);padding-bottom:16px;margin-bottom:16px;}
.forum-q-text{font-size:14px;color:var(--text1);margin-bottom:4px;}
.forum-q-date{font-size:11px;color:var(--text3);margin-bottom:8px;}
.forum-answer{background:var(--green1);border-radius:8px;padding:8px 12px;margin-bottom:6px;font-size:13px;color:var(--text2);}
/* Blog */
.blog-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.blog-card{cursor:pointer;transition:all .2s;}
.blog-card:hover{border-color:var(--green3)!important;transform:translateY(-2px);}
.blog-title{font-family:'Cormorant Garamond',serif;font-size:18px;color:var(--text1);margin-bottom:6px;line-height:1.4;}
.blog-date{font-size:12px;color:var(--text3);margin-bottom:8px;}
.blog-excerpt{font-size:13px;color:var(--text2);line-height:1.7;}
/* Quiz */
.quiz-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
.quiz-card{cursor:pointer;transition:all .2s;}
.quiz-card:hover{border-color:var(--green3)!important;transform:translateY(-2px);}
/* Ebook */
.ebook-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;}
.ebook-card{transition:all .2s;cursor:pointer;}
.ebook-card:hover{transform:translateY(-3px);box-shadow:0 6px 20px rgba(0,0,0,.08);}
.ebook-cover{width:100%;height:120px;border-radius:10px;margin-bottom:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:28px;position:relative;overflow:hidden;}
.ebook-cover-label{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.25);color:white;font-size:9px;text-align:center;padding:3px 4px;font-weight:500;letter-spacing:.3px;text-transform:uppercase;}
.ebook-title-small{font-size:12px;color:var(--text1);font-weight:500;line-height:1.4;margin-bottom:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.ebook-desc-small{font-size:11px;color:var(--text3);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
@media(max-width:768px){.ebook-grid{grid-template-columns:repeat(3,1fr);gap:10px;}}
@media(max-width:480px){.ebook-grid{grid-template-columns:repeat(2,1fr);gap:8px;}}
.ebook-title{font-family:'Cormorant Garamond',serif;font-size:16px;color:var(--text1);margin-bottom:6px;line-height:1.3;}
/* Admin */
.admin-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:28px;}
.stat-card{background:var(--green1);border-radius:12px;padding:16px;text-align:center;}
.stat-icon{font-size:24px;margin-bottom:6px;}
.stat-val{font-family:'Cormorant Garamond',serif;font-size:28px;color:var(--green5);}
.stat-label{font-size:12px;color:var(--text3);}
/* Radio quiz */
.quiz-option{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:8px;margin-bottom:6px;cursor:pointer;background:transparent;border:1px solid var(--green2);transition:all .15s;}
.quiz-option.selected{background:var(--green1);border-color:var(--green3);}
.quiz-option input[type=radio]{width:auto;margin:0;border:none;padding:0;}
/* Notif btn */
.notif-btn{background:#fff3cd;border:none;border-radius:20px;padding:4px 12px;font-size:12px;color:#856404;cursor:pointer;}
/* Empty state */
.empty-state{text-align:center;padding:60px 0;color:var(--text3);}
.empty-icon{font-size:40px;margin-bottom:12px;}
/* Page padding */
.page-pad{padding:32px 36px;}
.page-pad-narrow{padding:32px 36px;max-width:760px;}
/* Input row */
.input-row{display:flex;gap:8px;margin-bottom:20px;}
.input-row input{flex:1;}
/* Admin notif item */
.notif-item{display:flex;gap:12px;align-items:flex-start;border-bottom:1px solid var(--green2);padding-bottom:12px;margin-bottom:12px;}

/* Hamburger */
#hamburger{display:none;background:none;border:none;cursor:pointer;font-size:22px;color:var(--text1);padding:4px 8px;}
#sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:199;}
/* Delete button */
.btn-danger{background:transparent;color:#c0392b;border:1.5px solid #e74c3c;border-radius:20px;padding:6px 14px;font-family:'DM Sans',sans-serif;font-size:12px;cursor:pointer;transition:all .2s;}
.btn-danger:hover{background:#ffeaea;}
.card-actions{display:flex;gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid var(--green2);}
/* Responsive */
@media(max-width:768px){
  #sidebar{position:fixed;left:-240px;top:0;height:100vh;z-index:200;transition:left .25s;width:240px;}
  #sidebar.open{left:0;}
  #sidebar-overlay.open{display:block;}
  #hamburger{display:block;}
  #main{width:100%;}
  #topbar{padding:12px 16px;}
  .page-pad{padding:20px 16px;}
  .page-pad-narrow{padding:20px 16px;}
  .landing-grid{grid-template-columns:1fr;gap:32px;}
  .landing-title{font-size:34px;}
  .landing-body{padding:24px 16px;}
  .module-grid{grid-template-columns:repeat(3,1fr);}
  .blog-grid{grid-template-columns:1fr;}
  .quiz-grid{grid-template-columns:1fr 1fr;}
  .ebook-grid{grid-template-columns:1fr 1fr;}
  .admin-stats{grid-template-columns:1fr 1fr;}
  .sub-grid{grid-template-columns:1fr;}
  .vis-grid{grid-template-columns:1fr;}
  .page-header{flex-direction:column;align-items:flex-start;gap:12px;}
  .login-box{padding:24px 20px;}
}
@media(max-width:480px){
  .module-grid{grid-template-columns:repeat(2,1fr);}
  .quiz-grid{grid-template-columns:1fr;}
  .ebook-grid{grid-template-columns:1fr;}
  .admin-stats{grid-template-columns:1fr 1fr;}
  .landing-title{font-size:28px;}
}

/* Rich text editor */
.editor-toolbar{display:flex;flex-wrap:wrap;gap:4px;padding:8px;background:var(--green1);border:1.5px solid var(--green2);border-bottom:none;border-radius:10px 10px 0 0;}
.editor-btn{background:white;border:1px solid var(--green2);border-radius:6px;padding:4px 10px;font-size:13px;cursor:pointer;color:var(--text2);transition:all .15s;min-width:32px;text-align:center;}
.editor-btn:hover{background:var(--green2);color:var(--green5);}
.editor-btn.active{background:var(--green4);color:white;border-color:var(--green4);}
.editor-content{border:1.5px solid var(--green2);border-radius:0 0 10px 10px;padding:12px 14px;min-height:160px;outline:none;font-family:'DM Sans',sans-serif;font-size:14px;color:var(--text1);line-height:1.8;background:white;overflow-y:auto;}
.editor-content:focus{border-color:var(--green4);}
.editor-content b,.editor-content strong{font-weight:700;}
.editor-content i,.editor-content em{font-style:italic;}
.editor-content u{text-decoration:underline;}
.editor-content ul{padding-left:20px;margin:4px 0;}
.editor-content ol{padding-left:20px;margin:4px 0;}
.editor-content h3{font-family:'Cormorant Garamond',serif;font-size:18px;color:var(--green5);margin:8px 0 4px;}
/* Quiz kategori tabs */
.quiz-cat-tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px;}
.quiz-cat-tab{padding:6px 16px;border-radius:20px;border:1.5px solid var(--green2);background:white;color:var(--text2);font-size:13px;cursor:pointer;transition:all .15s;font-family:'DM Sans',sans-serif;}
.quiz-cat-tab.active{background:var(--green4);color:white;border-color:var(--green4);}
.quiz-cat-section{margin-bottom:32px;}
.quiz-cat-title{font-family:'Cormorant Garamond',serif;font-size:22px;color:var(--green5);margin-bottom:16px;padding-bottom:8px;border-bottom:2px solid var(--green2);}
/* Materi content rendered */
.materi-rendered-content{font-size:15px;color:#2d3748;line-height:1.95;letter-spacing:.01em;}
.materi-rendered-content p{margin-bottom:14px;}
.materi-rendered-content b,.materi-rendered-content strong{font-weight:700;color:var(--text1);}
.materi-rendered-content i,.materi-rendered-content em{font-style:italic;color:var(--text2);}
.materi-rendered-content u{text-decoration:underline;text-underline-offset:3px;}
.materi-rendered-content ul{padding-left:22px;margin:10px 0 14px;}
.materi-rendered-content ol{padding-left:22px;margin:10px 0 14px;}
.materi-rendered-content li{margin-bottom:6px;line-height:1.8;}
.materi-rendered-content h3{font-family:'Cormorant Garamond',serif;font-size:21px;color:var(--green5);margin:20px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--green2);}
.materi-rendered-content blockquote{border-left:3px solid var(--green4);margin:14px 0;padding:10px 16px;background:var(--green1);border-radius:0 8px 8px 0;font-style:italic;}
@media(max-width:768px){
  .materi-rendered-content{font-size:15.5px;line-height:2.05;}
  .page-pad-narrow{padding:16px 14px;max-width:100%;}
}

.blog-cover-img{width:100%;height:180px;object-fit:cover;border-radius:10px;margin-bottom:12px;}
.blog-cover-img-detail{width:100%;max-height:360px;object-fit:cover;border-radius:12px;margin-bottom:20px;}
.img-hint{font-size:11px;color:var(--text3);margin-top:4px;margin-bottom:12px;line-height:1.5;}

/* Ruang Aman */
.mood-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:20px;}
.mood-btn{border:2px solid var(--green2);border-radius:16px;padding:16px 8px;cursor:pointer;background:white;transition:all .2s;text-align:center;}
.mood-btn:hover{transform:translateY(-3px);box-shadow:0 4px 12px rgba(0,0,0,.08);}
.mood-btn.selected{border-color:var(--green4);background:var(--green1);}
.mood-emoji{font-size:32px;margin-bottom:6px;}
.mood-label{font-size:11px;color:var(--text3);line-height:1.3;}

function createEditor(placeholder, onChange) {
  const wrap = document.createElement('div');
  wrap.style.marginBottom = '12px';

  // Toolbar
  const tb = el('div', {class:'editor-toolbar'});
  const buttons = [
    {cmd:'bold',      icon:'<b>B</b>',    title:'Bold'},
    {cmd:'italic',    icon:'<i>I</i>',    title:'Italic'},
    {cmd:'underline', icon:'<u>U</u>',    title:'Underline'},
    {cmd:'sep'},
    {cmd:'insertUnorderedList', icon:'• List', title:'Bullet List'},
    {cmd:'insertOrderedList',   icon:'1. List', title:'Numbered List'},
    {cmd:'sep'},
    {cmd:'h3',        icon:'Judul',       title:'Heading'},
    {cmd:'removeFormat', icon:'✕ Format', title:'Hapus Format'},
  ];
  buttons.forEach(b => {
    if(b.cmd === 'sep') {
      const sep = document.createElement('span');
      sep.style.cssText = 'width:1px;background:var(--green3);margin:2px 4px;';
      tb.appendChild(sep); return;
    }
    const btn = document.createElement('button');
    btn.className = 'editor-btn';
    btn.innerHTML = b.icon;
    btn.title = b.title;
    btn.type = 'button';
    btn.onmousedown = (e) => {
      e.preventDefault();
      if(b.cmd === 'h3') {
        document.execCommand('formatBlock', false, 'h3');
      } else {
        document.execCommand(b.cmd, false, null);
      }
      editor.focus();
      onChange(editor.innerHTML);
    };
    tb.appendChild(btn);
  });

  // Content area
  const editor = document.createElement('div');
  editor.className = 'editor-content';
  editor.contentEditable = true;
  editor.setAttribute('placeholder', placeholder);
  editor.style.cssText += `position:relative;`;
  editor.oninput = () => onChange(editor.innerHTML);

  // Placeholder via CSS pseudo
  const style = document.createElement('style');
  style.textContent = `.editor-content:empty:before{content:attr(placeholder);color:var(--text3);pointer-events:none;}`;
  document.head.appendChild(style);

  wrap.appendChild(tb);
  wrap.appendChild(editor);

  wrap.getValue = () => editor.innerHTML;
  wrap.setValue = (v) => { editor.innerHTML = v || ''; };
  return wrap;
}

const FB_URL = "https://comdev-komida-default-rtdb.asia-southeast1.firebasedatabase.app";

// ─── NORMALISASI CABANG ───────────────────────────────────────────────────────
function normCabang(raw) {
  if(!raw) return '';
  let c = raw.trim().toLowerCase();
  // Hapus kata-kata umum yang sering ditambahkan
  const stopWords = ['kalimantan','tengah','selatan','utara','barat','timur','provinsi','kota','kabupaten','kab','prov'];
  // Pecah berdasarkan koma — ambil bagian pertama yang bermakna
  const parts = c.split(',').map(p=>p.trim()).filter(p=>p.length>0);
  // Pilih bagian terpendek yang bukan stopword
  let best = parts[0] || c;
  parts.forEach(p=>{
    const words = p.split(/\s+/);
    const meaningful = words.filter(w=>!stopWords.includes(w));
    if(meaningful.length>0 && p.length < best.length) best=p;
  });
  // Bersihkan spasi ganda
  return best.replace(/\s+/g,' ').trim();
}

async function fbGet(path) {
  try {
    const r = await fetch(`${FB_URL}/${path}.json`);
    return await r.json();
  } catch(e) { console.error('fbGet error:', e); return null; }
}
async function fbSet(path, data) {
  try {
    const r = await fetch(`${FB_URL}/${path}.json`, {
      method: 'PUT',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(data)
    });
    return await r.json();
  } catch(e) { console.error('fbSet error:', e); return null; }
}
async function fbPush(path, data) {
  try {
    const r = await fetch(`${FB_URL}/${path}.json`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(data)
    });
    return await r.json();
  } catch(e) { console.error('fbPush error:', e); return null; }
}
async function fbDelete(path) {
  try {
    await fetch(`${FB_URL}/${path}.json`, {method: 'DELETE'});
  } catch(e) { console.error('fbDelete error:', e); }
}

// ─── LOCAL STORAGE (sesi user) ───────────────────────────────────────────────
function load(key, def) {
  try { const s = localStorage.getItem(key); return s ? JSON.parse(s) : def; } catch { return def; }
}
function save(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch {}
}

// ─── APP STATE ────────────────────────────────────────────────────────────────
const state = {
  user: (()=>{
    const savedUser = load('comdev_user', null);
    const loginDate = load('comdev_login_date', null);
    const today = new Date().toISOString().slice(0,10);
    // Kalau tanggal login beda dengan hari ini → paksa logout
    if(savedUser && loginDate !== today) {
      localStorage.removeItem('comdev_user');
      localStorage.removeItem('comdev_login_date');
      return null;
    }
    return savedUser;
  })(),
  page: 'beranda',
  data: {modules:{},blogs:[],quizzes:[],ebooks:[]},
  notifications: [],
  counter: 0,
  loginLog: [],
  loading: true,
  modulView: 'list', activeModule: null, activeSub: null, activeMateri: null,
  blogView: 'list', activePost: null,
  ruangAmanView: 'list', activeCerita: null,
  quizView: 'list', activeQuiz: null, quizAnswers: {}, quizSubmitted: false, quizScore: null,
  forum: {},
  quoteIdx: new Date().getDay() % QUOTES.length,
};

// ─── INIT DATA dari Firebase ─────────────────────────────────────────────────
async function initData() {
  state.loading = true; render();
  try {
    const [blogs, quizzes, ebooks, modules, forum, loginlog] = await Promise.all([
      fbGet('blogs'), fbGet('quizzes'), fbGet('ebooks'),
      fbGet('modules'), fbGet('forum'), fbGet('loginlog'),
    ]);
    // blogs: {id: {...}, id2: {...}}
    state.data.blogs   = blogs   ? Object.entries(blogs).map(([k,v])=>({...v,_key:k}))   : [];
    state.data.quizzes = quizzes ? Object.entries(quizzes).map(([k,v])=>({...v,_key:k})) : [];
    state.data.ebooks  = ebooks  ? Object.entries(ebooks).map(([k,v])=>({...v,_key:k}))  : [];
    // Hanya pakai data Firebase jika ada — jangan overwrite dengan default
    if(modules && typeof modules === 'object' && Object.keys(modules).length > 0) {
      // Kembalikan key yang punya _ menjadi nama aslinya (match dengan MODULES)
      const restored = {};
      Object.entries(modules).forEach(([k,v])=>{
        // Cari nama asli di MODULES yang match setelah di-encode
        const original = MODULES.find(m=>m.replace(/[.#$\[\]/]/g,'_')===k) || k;
        restored[original] = v;
      });
      state.data.modules = restored;
    } else {
      // Firebase kosong — inisialisasi modul default
      MODULES.forEach(m=>{ state.data.modules[m]={subModuls:{}}; });
      saveModules();
    }
    state.forum        = forum   || {};
    const logArr = loginlog ? Object.values(loginlog) : [];
    state.loginLog = logArr;
    // Hitung user unik berdasarkan nama
    const namaUnik = new Set(logArr.map(l=>(l.nama||'').trim().toLowerCase()));
    state.counter  = namaUnik.size;
  } catch(e) { console.error('Init error:',e); }
  state.loading = false; render();
}
async function saveModules() {
  // Encode nama modul & sub modul yang jadi key Firebase
  const safeMods = {};
  Object.entries(state.data.modules).forEach(([k,v])=>{
    const safeK = k.replace(/[.#$\[\]/]/g,'_');
    const safeSubs = {};
    Object.entries(v.subModuls||{}).forEach(([sk,sv])=>{
      const safeSK = sk.replace(/[.#$\[\]/]/g,'_');
      safeSubs[safeSK] = sv;
    });
    safeMods[safeK] = {...v, subModuls: safeSubs};
  });
  await fbSet('modules', safeMods);
}

async function recordLogin(user) {

  const namaLower = user.name.trim().toLowerCase();

  const entry = {nama:user.name, role:user.role, cabang:user.cabang||'', nik:user.nik||'', waktu};

function setState(patch) {
  Object.assign(state, patch);
  if ('user' in patch) {
    save('comdev_user', state.user);
    if(state.user) {

      save('comdev_login_date', new Date().toISOString().slice(0,10));
    } else {
      localStorage.removeItem('comdev_login_date');

  }
  // Push history untuk back button mobile
  if('page' in patch || 'modulView' in patch || 'blogView' in patch || 'quizView' in patch) {
    history.pushState({}, '');
  }
  render();
}

// ─── HELPERS ──────────────────────────────────────────────────────────────────
function el(tag, attrs, ...children) {
  const e = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs||{})) {
    if (k==='class') e.className=v;
    else if (k==='style' && typeof v==='object') Object.assign(e.style, v);
    else if (k.startsWith('on')) e.addEventListener(k.slice(2).toLowerCase(), v);
    else e.setAttribute(k, v);
  }
  for (const c of children) {
    if (c==null||c===false) continue;
    if (typeof c==='string'||typeof c==='number') e.appendChild(document.createTextNode(String(c)));
    else if (c instanceof Node) e.appendChild(c);
    else if (Array.isArray(c)) c.forEach(ci=>ci&&e.appendChild(typeof ci==='string'?document.createTextNode(ci):ci));
  }
  return e;
}

function modal(content, onClose) {
  const overlay = el('div', {class:'modal-overlay', onClick: e=>{ if(e.target===overlay) onClose(); }},
    el('div', {class:'modal', onClick: e=>e.stopPropagation()}, content)
  );
  document.body.appendChild(overlay);
  return overlay;
}

function removeModal(m) { if(m&&m.parentNode) m.parentNode.removeChild(m); }

function renderSidebar() {

function toggleSidebar(){

  if(ov){ ov.classList.toggle('open'); }

function renderTopbar() {
  const {page, notifications} = state;
  const isAdmin = state.user && state.user.role==='comdev komida';
  const labels = {beranda:'🏠 Beranda',modul:'📖 Modul Literasi',ruangaman:'💚 Daily Mood Check',quiz:'🧩 Quiz',ebook:'📚 E-Book',admin:'⚙️ Admin Panel',profil:'👤 Profil Saya'};
  const bar = el('div',{id:'topbar'});
  const left = el('div',{style:{display:'flex',alignItems:'center',gap:'10px',flex:'1'}});
  left.appendChild(el('button',{id:'hamburger',onClick:toggleSidebar},'☰'));
  left.appendChild(el('div',{style:{fontSize:'13px',color:'var(--text3)',textTransform:'capitalize',flexShrink:'0'}}, labels[page]||page));

  // Global search bar
  const gsWrap = el('div',{class:'global-search-wrap'});
  gsWrap.appendChild(el('span',{class:'global-search-icon'},'🔍'));
  const gsInput = el('input',{type:'text',class:'global-search-input',placeholder:'Cari materi, quiz, e-book...'});
  const gsResults = el('div',{class:'global-results',style:{display:'none'}});
  gsWrap.appendChild(gsInput);
  gsWrap.appendChild(gsResults);

  let gsTimer;
  gsInput.addEventListener('input', e=>{
    clearTimeout(gsTimer);
    const q = e.target.value.trim().toLowerCase();
    if(q.length < 2){ gsResults.style.display='none'; return; }
    gsTimer = setTimeout(()=>runGlobalSearch(q), 300);
  });
  gsInput.addEventListener('focus', e=>{
    if(e.target.value.trim().length>=2) gsResults.style.display='block';
  });
  document.addEventListener('click', e=>{
    if(!gsWrap.contains(e.target)) gsResults.style.display='none';
  });

  function runGlobalSearch(q) {
    gsResults.innerHTML = '';
    gsResults.style.display='block';
    const keywords = q.split(/\s+/).filter(w=>w.length>1);
    if(keywords.length===0){ keywords.push(q); }
    const results = [];

    // Cari materi
    const allMods2 = state.data.modules||{};
    Object.entries(allMods2).forEach(([modName,mod])=>{
      Object.entries(mod.subModuls||{}).forEach(([subName,sub])=>{
        (sub.materis||[]).forEach(m=>{
          const title = (m.title||'').toLowerCase();
          const body  = (m.content||'').replace(/<[^>]*>/g,'').toLowerCase();
          let score=0;
          keywords.forEach(kw=>{ if(title.includes(kw))score+=3; if(body.includes(kw))score+=1; });
          if(score>0) results.push({type:'materi',icon:MODULE_ICONS[modName]||'📖',
            title:m.title,sub:`${modName} › ${subName}`,
            snippet:(m.content||'').replace(/<[^>]*>/g,'').slice(0,80),
            score,onClick:()=>{
              gsInput.value=''; gsResults.style.display='none';
              setState({page:'modul',activeModule:modName,activeSub:subName,activeMateri:m,modulView:'materiDetail'});
            }});
        });
      });
    });

    // Cari quiz
    (state.data.quizzes||[]).forEach(qz=>{
      const title=(qz.title||'').toLowerCase();
      const cat=(qz.category||'').toLowerCase();
      let score=0;
      keywords.forEach(kw=>{ if(title.includes(kw))score+=3; if(cat.includes(kw))score+=2; });
      (qz.questions||[]).forEach(q2=>{ if((q2.text||'').toLowerCase().includes(keywords[0]))score+=1; });
      if(score>0) results.push({type:'quiz',icon:'🧩',title:qz.title,
        sub:`Quiz · ${qz.category||'Umum'}`,snippet:`${qz.questions?.length||0} pertanyaan`,
        score,onClick:()=>{
          gsInput.value=''; gsResults.style.display='none';
          setState({page:'quiz',activeQuiz:qz,quizView:'take',quizSubmitted:false,quizAnswers:{},quizScore:null});
        }});
    });

    // Cari e-book
    (state.data.ebooks||[]).forEach(eb=>{
      const title=(eb.title||'').toLowerCase();
      const desc=(eb.description||'').toLowerCase();
      const cat=(eb.category||'').toLowerCase();
      let score=0;
      keywords.forEach(kw=>{ if(title.includes(kw))score+=3; if(desc.includes(kw))score+=1; if(cat.includes(kw))score+=2; });
      if(score>0) results.push({type:'ebook',icon:'📚',title:eb.title,
        sub:`E-Book · ${eb.category||''}`,snippet:eb.description||'',
        score,onClick:()=>{
          gsInput.value=''; gsResults.style.display='none';
          setState({page:'ebook'});
        }});
    });

    // Sort by score
    results.sort((a,b)=>b.score-a.score);

    if(results.length===0){
      gsResults.appendChild(el('div',{style:{padding:'16px',textAlign:'center',fontSize:'13px',color:'var(--text3)'}},'Tidak ditemukan untuk "'+q+'"'));
      return;
    }

    // Tampilkan per tipe
    const sections = [{key:'materi',label:'📖 Materi'},{key:'quiz',label:'🧩 Quiz'},{key:'ebook',label:'📚 E-Book'}];
    sections.forEach(sec=>{
      const items = results.filter(r=>r.type===sec.key).slice(0,4);
      if(items.length===0) return;
      gsResults.appendChild(el('div',{class:'global-result-section'},sec.label+` (${items.length})`));
      items.forEach(r=>{
        const item = el('div',{class:'global-result-item',onClick:r.onClick});
        item.appendChild(el('div',{class:'global-result-icon'},r.icon));
        const txt = el('div',{style:{flex:'1'}});
        txt.appendChild(el('div',{class:'global-result-title'},r.title));
        txt.appendChild(el('div',{class:'global-result-sub'},r.sub));
        if(r.snippet) txt.appendChild(el('div',{class:'global-result-snippet'},r.snippet.slice(0,80)+'...'));
        item.appendChild(txt);
        gsResults.appendChild(item);
      });
    });
  }

  left.appendChild(gsWrap);
  bar.appendChild(left);
  const right = el('div',{style:{display:'flex',alignItems:'center',gap:'10px'}});
  if(isAdmin){
    if(notifications.length>0){
      right.appendChild(el('button',{class:'notif-btn',onClick:()=>setState({page:'admin'})},
        `🔔 ${notifications.length} notif baru`));
    }
    right.appendChild(el('span',{class:'tag'},'Admin'));
  }
  bar.appendChild(right);
  return bar;
}

function renderModul() {
  const {modulView, activeModule, activeSub, activeMateri, data, notifications} = state;

      const rSet = new Set(JSON.parse(localStorage.getItem(rKey)||'[]'));

    mcard.appendChild(el('div',{style:{fontFamily:"'Cormorant Garamond',serif",fontSize:'26px',color:'var(--text1)',marginBottom:'8px'}},activeMateri.title));
    mcard.appendChild(el('div',{style:{fontSize:'11px',color:'var(--text3)',marginBottom:'16px'}},`📅 ${activeMateri.date}`));

    fi.addEventListener('keydown',e=>{if(e.key==='Enter')postQuestion();});
    fi.addEventListener('input',()=>forumInput=fi.value);
    const sendBtn = el('button',{class:'btn-primary',onClick:()=>postQuestion()},'Kirim');
    fcard.appendChild(el('div',{class:'input-row'},fi,sendBtn));

    function postQuestion(){
      if(!fi.value.trim())return;
      const k = key;
      const q2 = {id:Date.now(),text:fi.value.trim(),date:new Date().toLocaleDateString('id-ID'),answers:[]};
      state.forum[k] = [...(state.forum[k]||[]), q2];
      state.notifications = [...state.notifications,{id:Date.now(),text:`Pertanyaan baru di "${activeMateri.title}": ${q2.text.slice(0,60)}...`}];
      fi.value='';
      fbSet('forum/'+encodeURIComponent(k).replace(/\./g,'%2E'), state.forum[k]);
      setState({});
    }

    const qlist = el('div');
    if(questions.length===0){
      qlist.appendChild(el('p',{style:{fontSize:'13px',color:'var(--text3)',textAlign:'center',padding:'20px 0'}},'Belum ada diskusi. Jadilah yang pertama bertanya!'));
    }
    questions.forEach(q2=>{
      const qi = el('div',{class:'forum-q'});
      qi.appendChild(el('div',{class:'forum-q-text'},q2.text));
      qi.appendChild(el('div',{class:'forum-q-date'},`📅 ${q2.date}`));
      q2.answers.forEach(a=>{
        const ad = el('div',{class:'forum-answer'});
        ad.innerHTML=`<strong style="color:var(--green5)">Admin: </strong>${a.text}`;
        qi.appendChild(ad);
      });
      if(isAdmin){
        let ansInput = '';
        const replyBtn = el('button',{style:{fontSize:'12px',color:'var(--green5)',background:'none',border:'none',cursor:'pointer'}},'Balas →');
        const replyForm = el('div',{style:{display:'none',flexDirection:'row',gap:'8px',marginTop:'8px'}});

          const k2=key;
          state.forum[k2]=(state.forum[k2]||[]).map(qq=>qq.id===q2.id?{...qq,answers:[...qq.answers,{id:Date.now(),text:ri.value.trim(),date:new Date().toLocaleDateString('id-ID')}]}:qq);
          fbSet('forum/'+encodeURIComponent(k2).replace(/\./g,'%2E'), state.forum[k2]);
          setState({});

        replyBtn.onclick=()=>{replyForm.style.display='flex';};
        replyForm.appendChild(ri); replyForm.appendChild(rb);
        qi.appendChild(replyBtn); qi.appendChild(replyForm);

  });

  // Fungsi cari materi di semua modul
  // Sinonim / kata terkait untuk query umum bahasa Indonesia
  const SINONIM = {
    'sedih':    ['sedih','murung','galau','berduka','kesepian','depresi','stress','muram'],
    'senang':   ['senang','bahagia','gembira','suka','ceria','positif'],
    'stress':   ['stress','stres','tertekan','burnout','lelah','capek','beban'],
    'marah':    ['marah','emosi','amarah','konflik','kekerasan'],
    'cemas':    ['cemas','khawatir','takut','panik','anxiety','gelisah'],
    'sakit':    ['sakit','penyakit','kesehatan','gejala','nyeri'],
    'uang':     ['uang','keuangan','tabungan','hutang','modal','ekonomi','finansial'],
    'anak':     ['anak','bayi','balita','remaja','pendidikan','sekolah'],
    'kerja':    ['kerja','usaha','bisnis','wirausaha','penghasilan','karir'],
    'keluarga': ['keluarga','suami','istri','rumah tangga','pernikahan'],
    'ngilangin':['menghilangkan','mengatasi','cara','tips','solusi','mengurangi'],
    'cara':     ['cara','tips','langkah','panduan','solusi','metode'],
    'belajar':  ['belajar','pendidikan','literasi','pengetahuan','wawasan'],
  };

  function expandKeywords(q) {
    const words = q.toLowerCase().split(/\s+/).filter(w=>w.length>2);
    const expanded = new Set(words);
    words.forEach(w=>{
      if(SINONIM[w]) SINONIM[w].forEach(s=>expanded.add(s));
      // Juga cek apakah kata adalah bagian dari sinonim lain
      Object.entries(SINONIM).forEach(([key,syns])=>{
        if(syns.includes(w)) { expanded.add(key); syns.forEach(s=>expanded.add(s)); }
      });
    });
    return [...expanded];
  }

  function scoreMateri(m, keywords) {
    const title = m.title.toLowerCase();
    const body  = (m.content||'').replace(/<[^>]*>/g,'').toLowerCase();
    let score = 0;
    keywords.forEach(kw=>{
      if(title.includes(kw))  score += 3; // bobot judul lebih tinggi
      if(body.includes(kw))   score += 1;
    });
    return score;
  }

  function searchAllMateris(q) {
    const keywords = expandKeywords(q);
    const results = [];
    Object.entries(allModules).forEach(([modName, mod])=>{
      Object.entries(mod.subModuls||{}).forEach(([subName, sub])=>{
        (sub.materis||[]).forEach(m=>{
          const score = scoreMateri(m, keywords);
          if(score > 0) results.push({modName, subName, materi:m, score});
        });
      });
    });
    // Urutkan dari skor tertinggi
    return results.sort((a,b)=>b.score-a.score);
  }

        const resList = el('div',{style:{display:'flex',flexDirection:'column',gap:'8px',marginBottom:'20px'}});

          }},MODULE_ICONS[modName]||'📖');
          rc.appendChild(icon2);
          const txt2 = el('div',{style:{flex:'1'}});
          txt2.appendChild(el('div',{style:{fontSize:'13px',fontWeight:'500',color:'var(--text1)',marginBottom:'2px',lineHeight:'1.4'}},materi.title));
          txt2.appendChild(el('div',{style:{fontSize:'11px',color:'var(--text3)',marginBottom:'4px'}},`${modName} › ${subName}`));
          // Snippet isi
          const snippet = (materi.content||'').replace(/<[^>]*>/g,'').replace(/&nbsp;/g,' ').trim().slice(0,100);
          if(snippet) txt2.appendChild(el('div',{style:{fontSize:'12px',color:'var(--text3)',lineHeight:'1.5'}},snippet+'...'));
          rc.appendChild(txt2);
          resList.appendChild(rc);
        });
        searchResultArea.appendChild(resList);
      }
    }

    const filtered = modulSearch
      ? modList.filter(m=>m.toLowerCase().includes(modulSearch))
      : modList;

    if(filtered.length===0 && modulSearch.length <= 2) {
      grid.appendChild(el('div',{class:'search-no-result'},'Modul tidak ditemukan 🔍'));
    }
    if(filtered.length > 0) wrap.appendChild(grid);

    filtered.forEach(mod=>{
    const subs = Object.keys(((allModules[mod]||{}).subModuls)||{});
    const mc = el('div',{class:'card mod-card'});
    const mcTop = el('div',{style:{cursor:'pointer'},onClick:()=>setState({activeModule:mod,modulView:'submodul'})});
    // Cover berwarna
    const modCover = el('div',{class:'mod-cover',style:{background:getModColor(mod)}});
    modCover.appendChild(document.createTextNode(MODULE_ICONS[mod]||'📂'));
    mcTop.appendChild(modCover);
    const modInfo = el('div',{class:'mod-info'});
    modInfo.appendChild(el('div',{class:'mod-name'},mod));
    modInfo.appendChild(el('div',{class:'mod-count'},`${subs.length} sub`));
    mcTop.appendChild(modInfo);
    mc.appendChild(mcTop);
    if(isAdmin){
      const mca2 = el('div',{class:'card-actions'});
      mca2.appendChild(el('button',{class:'btn-danger',style:{fontSize:'12px'},onClick:()=>{
        if(!confirm(`Hapus modul "${mod}" beserta semua isinya?`)) return;
        delete state.data.modules[mod];
        setState({});
        // Hapus langsung dari Firebase pakai key yang sudah di-encode
        const safeModKey = mod.replace(/[.#$\[\]/]/g,'_');
        fbDelete('modules/' + encodeURIComponent(safeModKey));
      }},'🗑 Hapus'));
      mc.appendChild(mca2);
    }
      grid.appendChild(mc);
    });
  }
  renderModGrid();
  wrap.appendChild(grid);

  function showAddModuleModal(){
    let mName='';
    const m = modal([
      el('div',{style:{fontFamily:"'Cormorant Garamond',serif",fontSize:'22px',color:'var(--green5)',marginBottom:'16px'}},'Tambah Modul Baru'),
      el('input',{type:'text',placeholder:'Nama modul...',style:{marginBottom:'16px'},onInput:e=>mName=e.target.value}),
      el('div',{style:{display:'flex',gap:'10px'}},
        el('button',{class:'btn-primary',onClick:()=>{

        el('button',{class:'btn-secondary',onClick:()=>removeModal(m)},'Batal')
      )
    ], ()=>removeModal(m));
  }
  return wrap;
}

          (() => { const i = el('input',{type:'text',placeholder:'URL foto...',style:{marginBottom:'4px'}}); i.value=p.imageUrl||''; i.oninput=e=>editForm.imageUrl=e.target.value; return i; })(),
          el('div',{class:'img-hint'},'💡 URL foto dari imgur.com atau Google Drive'),
          (() => { editorEl.style.marginBottom='16px'; editorEl.setValue(p.content); return editorEl; })(),
          el('div',{style:{display:'flex',gap:'10px'}},

        ], ()=>removeModal(m));
      }},'✏️ Edit'));

        state.data.blogs = (state.data.blogs||[]).filter(b=>b.id!==p.id);
        if(p._key) fbDelete('blogs/'+p._key);
        setState({});
      }},'🗑 Hapus'));

  function showBlogForm(){
    let form = {title:'',category:'Narasi Sukses',content:'',imageUrl:''};
    const m = modal([

      el('input',{type:'text',placeholder:'Judul artikel...',style:{marginBottom:'12px'},onInput:e=>form.title=e.target.value}),

      el('div',{class:'img-hint'},'💡 Cara dapat URL foto: upload ke imgur.com → klik kanan foto → "Copy image address"'),
      (() => {
        const ed = createEditor('Tulis konten artikel...', v => form.content = v);
        ed.style.marginBottom = '16px';

          fbPush('blogs', post);

  return wrap;
}

// ─── PAGE: QUIZ ───────────────────────────────────────────────────────────────
function renderQuiz(){
  const {quizView, activeQuiz, quizAnswers, quizSubmitted, quizScore, data} = state;
  const isAdmin = state.user && state.user.role==='comdev komida';
  const quizzes = data.quizzes||[];

  if(quizView==='take' && activeQuiz){
    const wrap = el('div',{class:'page-pad fade-in',style:{maxWidth:'680px'}});
    wrap.appendChild(el('button',{class:'back-btn',style:{marginBottom:'24px'},onClick:()=>setState({quizView:'list',quizSubmitted:false,quizAnswers:{},quizScore:null})},'← Kembali'));

    if(quizSubmitted){
      const sc = el('div',{class:'card',style:{textAlign:'center',padding:'48px 32px'}});
      sc.appendChild(el('div',{style:{fontSize:'56px',marginBottom:'16px'}},quizScore>=70?'🎉':'📝'));
      sc.appendChild(el('div',{style:{fontFamily:"'Cormorant Garamond',serif",fontSize:'32px',color:'var(--green5)',marginBottom:'8px'}},`Nilai Anda: ${quizScore}`));
      sc.appendChild(el('div',{style:{fontSize:'14px',color:'var(--text2)',marginBottom:'24px'}},
        quizScore>=80?'Luar biasa! Pemahaman Anda sangat baik.':quizScore>=60?'Bagus! Terus tingkatkan pembelajaran Anda.':'Jangan menyerah! Pelajari lagi materinya ya.'
      ));
      const rev = el('div',{style:{background:'var(--green1)',borderRadius:'12px',padding:'16px 24px',marginBottom:'20px'}});
      activeQuiz.questions.forEach((q,i)=>{
        const ri = el('div',{style:{textAlign:'left',marginBottom:'12px',borderBottom:i<activeQuiz.questions.length-1?'1px solid var(--green2)':'none',paddingBottom:'12px'}});
        ri.appendChild(el('div',{style:{fontSize:'13px',color:'var(--text1)',marginBottom:'4px'}},`${i+1}. ${q.text}`));
        const correct = quizAnswers[q.id]===q.correct;
        const ans = el('div',{style:{fontSize:'12px',color:correct?'var(--green5)':'#c0392b'}},`Jawaban Anda: ${q.options[quizAnswers[q.id]]||'-'}`);
        ri.appendChild(ans);
        if(!correct) ri.appendChild(el('span',{style:{fontSize:'12px',color:'var(--text3)',marginLeft:'8px'}},`| Benar: ${q.options[q.correct]}`));
        rev.appendChild(ri);
      });
      sc.appendChild(rev);
      sc.appendChild(el('button',{class:'btn-primary',onClick:()=>setState({quizSubmitted:false,quizAnswers:{},quizScore:null})},'Coba Lagi'));
      wrap.appendChild(sc);
    } else {
      wrap.appendChild(el('div',{style:{fontFamily:"'Cormorant Garamond',serif",fontSize:'26px',color:'var(--text1)',marginBottom:'4px'}},activeQuiz.title));
      wrap.appendChild(el('div',{style:{fontSize:'13px',color:'var(--text3)',marginBottom:'24px'}},`${activeQuiz.questions.length} pertanyaan · ${activeQuiz.category}`));
      activeQuiz.questions.forEach((q,i)=>{
        const qc = el('div',{class:'card',style:{marginBottom:'16px'}});
        qc.appendChild(el('div',{style:{fontSize:'14px',color:'var(--text1)',fontWeight:'500',marginBottom:'12px'}},`${i+1}. ${q.text}`));
        q.options.filter(o=>o.trim()).forEach((opt,oi)=>{
          const oDiv = el('div',{class:`quiz-option${quizAnswers[q.id]===oi?' selected':''}`,onClick:()=>{
            const newAns={...state.quizAnswers,[q.id]:oi};
            setState({quizAnswers:newAns});
          }});
          const radio = document.createElement('input'); radio.type='radio'; radio.name=`q-${q.id}`; radio.style.width='auto'; radio.style.margin='0'; radio.style.border='none'; radio.style.padding='0';
          radio.checked = quizAnswers[q.id]===oi;
          oDiv.appendChild(radio);
          oDiv.appendChild(el('span',{style:{fontSize:'13px',color:'var(--text2)'}},opt));
          qc.appendChild(oDiv);
        });
        wrap.appendChild(qc);
      });
      wrap.appendChild(el('button',{class:'btn-primary',style:{marginTop:'8px'},onClick:()=>{
        let correct=0;
        activeQuiz.questions.forEach(q=>{if(state.quizAnswers[q.id]===q.correct)correct++;});
        const finalScore = Math.round((correct/activeQuiz.questions.length)*100);
        // Simpan ke riwayat quiz
        const qKey = 'quiz_history_' + ((state.user.nik||state.user.name)||'').replace(/[^a-z0-9]/gi,'_');
        const qHist = JSON.parse(localStorage.getItem(qKey)||'[]');
        qHist.push({title:activeQuiz.title, score:finalScore, waktu:new Date().toLocaleString('id-ID')});
        localStorage.setItem(qKey, JSON.stringify(qHist));
        setState({quizScore:finalScore,quizSubmitted:true});
      }},'Kumpulkan Jawaban'));
    }
    return wrap;
  }

  const wrap = el('div',{class:'page-pad fade-in'});
  const hdr = el('div',{class:'page-header'});
  const ht = el('div');
  ht.appendChild(el('div',{class:'page-title'},'Quiz'));
  ht.appendChild(el('p',{class:'page-sub'},'Uji pemahaman Anda dari materi yang dipelajari'));
  hdr.appendChild(ht);
  if(isAdmin) hdr.appendChild(el('button',{class:'btn-primary',onClick:showQuizForm},'+ Buat Quiz'));
  wrap.appendChild(hdr);

  if(quizzes.length===0){
    const es = el('div',{class:'empty-state'});
    es.appendChild(el('div',{class:'empty-icon'},'🧩'));
    es.appendChild(el('p',{},`Belum ada quiz.${isAdmin?' Buat quiz pertama!':''}`));
    wrap.appendChild(es);
  } else {
    // Kelompokkan quiz per kategori (normalize: huruf pertama kapital, sisanya kecil)
    function normCat(c) {
      if(!c) return 'Umum';
      return c.trim().charAt(0).toUpperCase() + c.trim().slice(1).toLowerCase();
    }
    const cats = {};
    quizzes.forEach(qz => {
      const cat = normCat(qz.category);
      if(!cats[cat]) cats[cat] = [];
      cats[cat].push(qz);
    });
    const allCats = Object.keys(cats);

    // Search bar quiz
    let quizSearch = '';

    function scoreQuiz(qz, keywords) {
      let score = 0;
      const title = (qz.title||'').toLowerCase();
      const cat   = (qz.category||'').toLowerCase();
      keywords.forEach(kw=>{
        if(title.includes(kw)) score+=3;
        if(cat.includes(kw))   score+=2;
        // Cari juga ke dalam pertanyaan
        (qz.questions||[]).forEach(q=>{
          if((q.text||'').toLowerCase().includes(kw)) score+=1;
          (q.options||[]).forEach(o=>{
            if((o||'').toLowerCase().includes(kw)) score+=0.5;
          });
        });
      });
      return score;
    }

    const quizSearchBar = createSearchBar('Cari quiz, topik, atau kata kunci pertanyaan...', q=>{
      quizSearch = q.toLowerCase().trim();
      renderCatContent();
    });
    wrap.appendChild(quizSearchBar);

    // Tab filter kategori
    const tabsWrap = el('div',{class:'quiz-cat-tabs'});
    let activeCat = allCats[0];
    const tabEls = {};

    function renderCatContent() {
      catContent.innerHTML = '';
      const grid = el('div',{class:'quiz-grid'});
      (cats[activeCat]||[]).forEach(qz=>{
        const qc = el('div',{class:'card quiz-card'});
        const qcTop = el('div',{style:{cursor:'pointer'},onClick:()=>setState({activeQuiz:qz,quizView:'take',quizSubmitted:false,quizAnswers:{},quizScore:null})});
        qcTop.appendChild(el('div',{style:{fontSize:'28px',marginBottom:'8px'}},'🧩'));
        qcTop.appendChild(el('div',{style:{fontFamily:"'Cormorant Garamond',serif",fontSize:'16px',color:'var(--text1)',marginBottom:'4px'}},qz.title));
        qcTop.appendChild(el('div',{style:{fontSize:'12px',color:'var(--text3)'}},`${qz.questions.length} pertanyaan · ${qz.date}`));
        qcTop.appendChild(el('div',{style:{marginTop:'12px',fontSize:'12px',color:'var(--green5)'}},'Mulai Quiz →'));
        qc.appendChild(qcTop);
        if(isAdmin){
          const qca = el('div',{class:'card-actions'});
          qca.appendChild(el('button',{class:'btn-secondary',style:{fontSize:'12px'},onClick:()=>{
            let editTitle = qz.title, editCat = qz.category;
            const m = modal([
              el('div',{style:{fontFamily:"'Cormorant Garamond',serif",fontSize:'22px',color:'var(--green5)',marginBottom:'16px'}},'Edit Quiz'),
              (() => { const i = el('input',{type:'text',placeholder:'Judul quiz...',style:{marginBottom:'12px'}}); i.value=qz.title; i.oninput=e=>editTitle=e.target.value; return i; })(),
              (() => { const i = el('input',{type:'text',placeholder:'Kategori...',style:{marginBottom:'16px'}}); i.value=qz.category||''; i.oninput=e=>editCat=e.target.value; return i; })(),
              el('div',{style:{display:'flex',gap:'10px'}},
                el('button',{class:'btn-primary',onClick:()=>{
                  if(!editTitle.trim()) return;
                  const updated = {...qz, title:editTitle, category:editCat};
                  state.data.quizzes = state.data.quizzes.map(q=>q.id===qz.id?updated:q);
                  if(qz._key) fbSet('quizzes/'+qz._key, updated);
                  removeModal(m); setState({});
                }},'Simpan'),
                el('button',{class:'btn-secondary',onClick:()=>removeModal(m)},'Batal')
              )
            ], ()=>removeModal(m));
          }},'✏️ Edit'));
          qca.appendChild(el('button',{class:'btn-danger',onClick:()=>{
            if(!confirm(`Hapus quiz "${qz.title}"?`)) return;
            state.data.quizzes = (state.data.quizzes||[]).filter(q=>q.id!==qz.id);
            if(qz._key) fbDelete('quizzes/'+qz._key);
            setState({});
          }},'🗑 Hapus'));
          qc.appendChild(qca);
        }
        grid.appendChild(qc);
      });
      catContent.appendChild(grid);
    }

    allCats.forEach(cat => {
      const tab = el('button',{class:'quiz-cat-tab'+(cat===activeCat?' active':''), onClick:()=>{
        activeCat = cat;
        allCats.forEach(c=>tabEls[c]&&tabEls[c].classList.remove('active'));
        tab.classList.add('active');
        renderCatContent();
      }}, `${cat} (${cats[cat].length})`);
      tabEls[cat] = tab;
      tabsWrap.appendChild(tab);
    });
    wrap.appendChild(tabsWrap);

    const catContent = el('div',{});
    renderCatContent();
    wrap.appendChild(catContent);
  }

  function showQuizForm(){
    let form={title:'',category:'',questions:[]};
    let newQ={text:'',options:['','','',''],correct:0};
    const m = modal(buildQuizForm(), ()=>removeModal(m));

    function buildQuizForm(){
      const container = document.createElement('div');
      const rebuild = () => { while(container.firstChild) container.removeChild(container.firstChild); container.append(...buildQuizFormInner()); };

      function buildQuizFormInner(){
        const nodes=[];
        nodes.push(el('div',{style:{fontFamily:"'Cormorant Garamond',serif",fontSize:'22px',color:'var(--green5)',marginBottom:'16px'}},'Buat Quiz Baru'));
        const ti = el('input',{type:'text',placeholder:'Judul quiz...',style:{marginBottom:'10px'}});
        ti.value=form.title; ti.oninput=e=>form.title=e.target.value;
        nodes.push(ti);
        const ci = el('input',{type:'text',placeholder:'Kategori (misal: Keuangan, Kesehatan...)',style:{marginBottom:'16px'}});
        ci.value=form.category; ci.oninput=e=>form.category=e.target.value;
        nodes.push(ci);

        const qbox = el('div',{style:{background:'var(--green1)',borderRadius:'10px',padding:'14px',marginBottom:'16px'}});
        qbox.appendChild(el('div',{style:{fontSize:'13px',fontWeight:'500',color:'var(--text2)',marginBottom:'10px'}},'Tambah Pertanyaan'));
        const qi = el('input',{type:'text',placeholder:'Tulis pertanyaan...',style:{marginBottom:'8px'}});
        qi.value=newQ.text; qi.oninput=e=>newQ.text=e.target.value;
        qbox.appendChild(qi);
        ['A','B','C','D'].forEach((l,i)=>{
          const row = el('div',{style:{display:'flex',alignItems:'center',gap:'8px',marginBottom:'6px'}});
          const r = document.createElement('input'); r.type='radio'; r.name='qcorrect'; r.style.cssText='width:auto;margin:0;border:none;padding:0;'; r.checked=(newQ.correct===i); r.onchange=()=>newQ.correct=i;
          const oi = el('input',{type:'text',placeholder:`Pilihan ${l}`,style:{flex:'1'}});
          oi.value=newQ.options[i]; oi.oninput=e=>{const opts=[...newQ.options];opts[i]=e.target.value;newQ.options=opts;};
          row.appendChild(r); row.appendChild(oi);
          qbox.appendChild(row);
        });
        qbox.appendChild(el('div',{style:{fontSize:'11px',color:'var(--text3)',marginBottom:'10px'}},'* Centang radio untuk menandai jawaban benar'));
        qbox.appendChild(el('button',{class:'btn-secondary',style:{fontSize:'12px'},onClick:()=>{
          if(!newQ.text.trim())return;
          form.questions=[...form.questions,{...newQ,options:[...newQ.options],id:Date.now()}];
          newQ={text:'',options:['','','',''],correct:0}; rebuild();
        }},'+ Tambah ke Quiz'));
        nodes.push(qbox);

        if(form.questions.length>0){
          const ql = el('div',{style:{marginBottom:'16px'}});
          ql.appendChild(el('div',{style:{fontSize:'13px',color:'var(--text3)',marginBottom:'8px'}},`${form.questions.length} pertanyaan ditambahkan`));
          form.questions.forEach((q,i)=>ql.appendChild(el('div',{style:{fontSize:'12px',color:'var(--text2)',marginBottom:'4px'}},`${i+1}. ${q.text}`)));
          nodes.push(ql);
        }
        nodes.push(el('div',{style:{display:'flex',gap:'10px'}},
          el('button',{class:'btn-primary',onClick:()=>{
            if(!form.title.trim()||form.questions.length===0)return;
            const quiz={id:Date.now(),...form,date:new Date().toLocaleDateString('id-ID')};
            state.data.quizzes = [...(state.data.quizzes||[]), quiz];
            removeModal(m);
            setState({});
            fbPush('quizzes', quiz);
          }},'Simpan Quiz'),
          el('button',{class:'btn-secondary',onClick:()=>removeModal(m)},'Batal')
        ));
        return nodes;
      }
      container.append(...buildQuizFormInner());
      return container;
    }
    return m;
  }
  return wrap;
}

function renderEbook(){
  const {data} = state;
  const isAdmin = state.user && state.user.role==='comdev komida';
  const ebooks = data.ebooks||[];
  const wrap = el('div',{class:'page-pad fade-in'});

  const hdr = el('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'flex-end',marginBottom:'8px'}});
