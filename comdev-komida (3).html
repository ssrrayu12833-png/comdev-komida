<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Comdev KOMIDA</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --green1:#f0f7f0;--green2:#d4ead4;--green3:#a8d5a8;--green4:#6ab36a;--green5:#3d8b3d;
  --yellow1:#fefdf0;--yellow2:#fdf6d0;--yellow3:#f9eca0;--yellow4:#f0d040;--yellow5:#c8a800;
  --white:#ffffff;--text1:#1a2e1a;--text2:#3a5c3a;--text3:#6a8c6a;--cream:#fafcf5;
}
body{font-family:'DM Sans',sans-serif;background:var(--cream);color:var(--text1);}
h1,h2,h3,h4{font-family:'Cormorant Garamond',serif;}
::-webkit-scrollbar{width:6px;}
::-webkit-scrollbar-track{background:var(--green1);}
::-webkit-scrollbar-thumb{background:var(--green3);border-radius:3px;}
.btn-primary{background:var(--green4);color:#fff;border:none;border-radius:24px;padding:10px 28px;font-family:'DM Sans',sans-serif;font-size:14px;cursor:pointer;transition:all .2s;letter-spacing:.3px;}
.btn-primary:hover{background:var(--green5);transform:translateY(-1px);}
.btn-secondary{background:transparent;color:var(--green5);border:1.5px solid var(--green4);border-radius:24px;padding:9px 24px;font-family:'DM Sans',sans-serif;font-size:14px;cursor:pointer;transition:all .2s;}
.btn-secondary:hover{background:var(--green1);}
input,textarea,select{font-family:'DM Sans',sans-serif;font-size:14px;border:1.5px solid var(--green2);border-radius:10px;padding:10px 14px;width:100%;outline:none;background:white;color:var(--text1);transition:border-color .2s;}
input:focus,textarea:focus,select:focus{border-color:var(--green4);}
.card{background:white;border-radius:16px;border:1px solid var(--green2);padding:20px;}
.tag{display:inline-block;font-size:11px;padding:3px 10px;border-radius:12px;background:var(--green1);color:var(--green5);font-weight:500;letter-spacing:.3px;}
.fade-in{animation:fadeIn .4s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;z-index:1000;}
.modal{background:white;border-radius:20px;padding:28px;max-width:520px;width:90%;max-height:90vh;overflow-y:auto;}
/* Layout */
#app{display:flex;min-height:100vh;}
#sidebar{width:220px;min-height:100vh;background:white;border-right:1px solid var(--green2);display:flex;flex-direction:column;padding:24px 0;position:sticky;top:0;height:100vh;overflow-y:auto;}
#main{flex:1;overflow-y:auto;}
#topbar{background:white;border-bottom:1px solid var(--green2);padding:14px 36px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100;}
#page-content{min-height:calc(100vh - 53px);}
/* Sidebar */
.sidebar-logo{padding:0 20px 24px;border-bottom:1px solid var(--green2);}
.sidebar-logo .label{font-size:11px;color:var(--text3);letter-spacing:1px;text-transform:uppercase;margin-bottom:4px;}
.sidebar-logo h2{font-family:'Cormorant Garamond',serif;font-size:18px;color:var(--green5);font-weight:600;line-height:1.2;}
.sidebar-logo .sub{font-size:10px;color:var(--text3);margin-top:2px;}
.nav-area{flex:1;padding:16px 12px;}
.nav-btn{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border-radius:10px;border:none;cursor:pointer;background:transparent;color:var(--text2);font-family:'DM Sans',sans-serif;font-size:13px;font-weight:400;margin-bottom:2px;text-align:left;transition:all .15s;}
.nav-btn.active,.nav-btn:hover{background:var(--green1);color:var(--green5);}
.nav-btn.active{font-weight:500;}
.nav-icon{font-size:15px;}
.sidebar-user{padding:16px 20px;border-top:1px solid var(--green2);}
.sidebar-user .login-as{font-size:12px;color:var(--text3);margin-bottom:4px;}
.sidebar-user .uname{font-size:13px;font-weight:500;color:var(--text1);margin-bottom:2px;}
.sidebar-user .urole{font-size:11px;color:var(--text3);margin-bottom:10px;text-transform:capitalize;}
.sidebar-user button{font-size:12px;color:var(--text3);background:none;border:none;cursor:pointer;padding:0;}
/* Landing */
#landing{min-height:100vh;background:linear-gradient(160deg,var(--green1) 0%,var(--yellow1) 50%,white 100%);display:flex;flex-direction:column;}
.landing-counter{text-align:center;padding:12px 20px;background:rgba(255,255,255,.7);backdrop-filter:blur(10px);border-bottom:1px solid var(--green2);font-size:13px;color:var(--text3);}
.landing-body{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 20px;}
.landing-grid{display:grid;grid-template-columns:1fr 1fr;gap:60px;max-width:900px;width:100%;align-items:center;}
.landing-title{font-family:'Cormorant Garamond',serif;font-size:48px;color:var(--text1);line-height:1.15;margin-bottom:16px;}
.landing-desc{font-size:14.5px;color:var(--text2);line-height:1.9;margin-bottom:24px;}
.landing-tags{display:flex;flex-wrap:wrap;gap:8px;}
.landing-tag{font-size:12px;padding:4px 12px;border-radius:12px;background:white;border:1px solid var(--green3);color:var(--green5);}
.login-box{background:white;border-radius:24px;padding:36px 32px;box-shadow:0 4px 40px rgba(61,139,61,.1);border:1px solid var(--green2);}
.login-box h3{font-family:'Cormorant Garamond',serif;font-size:22px;color:var(--text1);margin-bottom:6px;}
.login-box p{font-size:13px;color:var(--text3);margin-bottom:24px;}
.form-label{font-size:12px;color:var(--text3);display:block;margin-bottom:6px;}
.role-option{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:10px;border:1.5px solid var(--green2);background:white;cursor:pointer;transition:all .15s;text-transform:capitalize;margin-bottom:8px;font-family:'DM Sans',sans-serif;font-size:13px;color:var(--text2);}
.role-option.selected{border-color:var(--green4);background:var(--green1);color:var(--green5);font-weight:500;}
.role-option input[type=radio]{width:auto;margin:0;border:none;padding:0;}
.error-box{font-size:12px;color:#c0392b;margin-bottom:12px;padding:8px 12px;background:#ffeaea;border-radius:8px;}
.landing-footer{text-align:center;padding:20px;font-size:12px;color:var(--text3);border-top:1px solid var(--green2);}
/* Beranda */
.quote-box{background:linear-gradient(135deg,var(--yellow1),var(--yellow2));border:1px solid var(--yellow3);border-radius:16px;padding:24px 28px;margin-bottom:28px;position:relative;overflow:hidden;}
.quote-label{font-size:11px;color:var(--yellow5);letter-spacing:1px;text-transform:uppercase;margin-bottom:10px;}
.quote-text{font-family:'Cormorant Garamond',serif;font-size:22px;color:var(--text1);line-height:1.5;margin-bottom:10px;font-style:italic;}
.quote-author{font-size:12px;color:var(--text3);}
.quote-dots{display:flex;gap:6px;margin-top:14px;}
.quote-dot{height:6px;border-radius:3px;border:none;cursor:pointer;transition:all .2s;background:var(--yellow3);}
.quote-dot.active{width:20px;background:var(--yellow5);}
.quote-dot:not(.active){width:6px;}
.vis-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.vis-card{background:var(--green1);border-radius:12px;padding:14px 16px;}
.vis-card-label{font-size:11px;color:var(--green5);font-weight:500;letter-spacing:1px;text-transform:uppercase;margin-bottom:6px;}
.vis-card-text{font-size:13px;color:var(--text2);line-height:1.7;}
/* Modul */
.module-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
.mod-card{cursor:pointer;transition:all .2s;}
.mod-card:hover{border-color:var(--green3)!important;transform:translateY(-2px);}
.mod-icon{font-size:28px;margin-bottom:8px;}
.mod-name{font-family:'Cormorant Garamond',serif;font-size:16px;color:var(--text1);margin-bottom:4px;}
.mod-count{font-size:11px;color:var(--text3);}
/* Breadcrumb */
.breadcrumb{display:flex;align-items:center;gap:12px;margin-bottom:24px;}
.back-btn{background:none;border:none;cursor:pointer;color:var(--green5);font-size:14px;font-family:'DM Sans',sans-serif;}
.bread-sep{color:var(--text3);}
.bread-text{font-size:12px;color:var(--text3);}
/* Page header */
.page-header{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:28px;}
.page-title{font-family:'Cormorant Garamond',serif;font-size:30px;color:var(--green5);}
.page-sub{font-size:14px;color:var(--text3);}
/* Sub modul grid */
.sub-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.sub-card{cursor:pointer;transition:all .2s;}
.sub-card:hover{border-color:var(--green3)!important;}
.sub-name{font-family:'Cormorant Garamond',serif;font-size:17px;color:var(--text1);margin-bottom:4px;}
.sub-count{font-size:12px;color:var(--text3);}
/* Materi list */
.materi-card{cursor:pointer;transition:all .2s;margin-bottom:12px;}
.materi-card:hover{border-color:var(--green3)!important;}
.materi-title{font-family:'Cormorant Garamond',serif;font-size:18px;color:var(--text1);margin-bottom:4px;}
.materi-date{font-size:12px;color:var(--text3);margin-bottom:8px;}
.materi-excerpt{font-size:13px;color:var(--text2);line-height:1.7;}
.read-more{margin-top:10px;font-size:12px;color:var(--green5);}
/* Forum */
.forum-q{border-bottom:1px solid var(--green2);padding-bottom:16px;margin-bottom:16px;}
.forum-q-text{font-size:14px;color:var(--text1);margin-bottom:4px;}
.forum-q-date{font-size:11px;color:var(--text3);margin-bottom:8px;}
.forum-answer{background:var(--green1);border-radius:8px;padding:8px 12px;margin-bottom:6px;font-size:13px;color:var(--text2);}
/* Blog */
.blog-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.blog-card{cursor:pointer;transition:all .2s;}
.blog-card:hover{border-color:var(--green3)!important;transform:translateY(-2px);}
.blog-title{font-family:'Cormorant Garamond',serif;font-size:18px;color:var(--text1);margin-bottom:6px;line-height:1.4;}
.blog-date{font-size:12px;color:var(--text3);margin-bottom:8px;}
.blog-excerpt{font-size:13px;color:var(--text2);line-height:1.7;}
/* Quiz */
.quiz-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
.quiz-card{cursor:pointer;transition:all .2s;}
.quiz-card:hover{border-color:var(--green3)!important;transform:translateY(-2px);}
/* Ebook */
.ebook-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
.ebook-card{transition:all .2s;}
.ebook-card:hover{border-color:var(--green3)!important;transform:translateY(-2px);}
.ebook-cover{width:48px;height:60px;background:linear-gradient(135deg,var(--green3),var(--green4));border-radius:6px;margin-bottom:12px;display:flex;align-items:center;justify-content:center;font-size:22px;}
.ebook-title{font-family:'Cormorant Garamond',serif;font-size:16px;color:var(--text1);margin-bottom:6px;line-height:1.3;}
/* Admin */
.admin-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:28px;}
.stat-card{background:var(--green1);border-radius:12px;padding:16px;text-align:center;}
.stat-icon{font-size:24px;margin-bottom:6px;}
.stat-val{font-family:'Cormorant Garamond',serif;font-size:28px;color:var(--green5);}
.stat-label{font-size:12px;color:var(--text3);}
/* Radio quiz */
.quiz-option{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:8px;margin-bottom:6px;cursor:pointer;background:transparent;border:1px solid var(--green2);transition:all .15s;}
.quiz-option.selected{background:var(--green1);border-color:var(--green3);}
.quiz-option input[type=radio]{width:auto;margin:0;border:none;padding:0;}
/* Notif btn */
.notif-btn{background:#fff3cd;border:none;border-radius:20px;padding:4px 12px;font-size:12px;color:#856404;cursor:pointer;}
/* Empty state */
.empty-state{text-align:center;padding:60px 0;color:var(--text3);}
.empty-icon{font-size:40px;margin-bottom:12px;}
/* Page padding */
.page-pad{padding:32px 36px;}
.page-pad-narrow{padding:32px 36px;max-width:760px;}
/* Input row */
.input-row{display:flex;gap:8px;margin-bottom:20px;}
.input-row input{flex:1;}
/* Admin notif item */
.notif-item{display:flex;gap:12px;align-items:flex-start;border-bottom:1px solid var(--green2);padding-bottom:12px;margin-bottom:12px;}

/* Hamburger */
#hamburger{display:none;background:none;border:none;cursor:pointer;font-size:22px;color:var(--text1);padding:4px 8px;}
#sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:199;}
/* Delete button */
.btn-danger{background:transparent;color:#c0392b;border:1.5px solid #e74c3c;border-radius:20px;padding:6px 14px;font-family:'DM Sans',sans-serif;font-size:12px;cursor:pointer;transition:all .2s;}
.btn-danger:hover{background:#ffeaea;}
.card-actions{display:flex;gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid var(--green2);}
/* Responsive */
@media(max-width:768px){
  #sidebar{position:fixed;left:-240px;top:0;height:100vh;z-index:200;transition:left .25s;width:240px;}
  #sidebar.open{left:0;}
  #sidebar-overlay.open{display:block;}
  #hamburger{display:block;}
  #main{width:100%;}
  #topbar{padding:12px 16px;}
  .page-pad{padding:20px 16px;}
  .page-pad-narrow{padding:20px 16px;}
  .landing-grid{grid-template-columns:1fr;gap:32px;}
  .landing-title{font-size:34px;}
  .landing-body{padding:24px 16px;}
  .module-grid{grid-template-columns:1fr 1fr;}
  .blog-grid{grid-template-columns:1fr;}
  .quiz-grid{grid-template-columns:1fr 1fr;}
  .ebook-grid{grid-template-columns:1fr 1fr;}
  .admin-stats{grid-template-columns:1fr 1fr;}
  .sub-grid{grid-template-columns:1fr;}
  .vis-grid{grid-template-columns:1fr;}
  .page-header{flex-direction:column;align-items:flex-start;gap:12px;}
  .login-box{padding:24px 20px;}
}
@media(max-width:480px){
  .module-grid{grid-template-columns:1fr;}
  .quiz-grid{grid-template-columns:1fr;}
  .ebook-grid{grid-template-columns:1fr;}
  .admin-stats{grid-template-columns:1fr 1fr;}
  .landing-title{font-size:28px;}
}
</style>
</head>
<body>

<div id="root"></div>

<script>
// ─── PALETTE & DATA ──────────────────────────────────────────────────────────
const MODULES = [
  "Kesehatan Dasar","Keuangan","Pendidikan & Hak Anak","Kewirausahaan",
  "Kesehatan Gender","Kesehatan Anak & Wanita","Pencegahan KDRT",
  "Isu Lingkungan","Pernikahan Dini","Pengembangan Diri","PSEAH",
  "Perlindungan Anak","GEDSI","Safeguarding"
];
const MODULE_ICONS = {
  "Kesehatan Dasar":"🏥","Keuangan":"💰","Pendidikan & Hak Anak":"📚",
  "Kewirausahaan":"💼","Kesehatan Gender":"🌸","Kesehatan Anak & Wanita":"👶",
  "Pencegahan KDRT":"🛡️","Isu Lingkungan":"🌿","Pernikahan Dini":"⚖️",
  "Pengembangan Diri":"✨","PSEAH":"🔒","Perlindungan Anak":"🧒",
  "GEDSI":"🤝","Safeguarding":"🛡️"
};
const QUOTES = [
  {text:"Perempuan yang kuat bukan yang tidak pernah jatuh, tapi yang selalu bangkit dan terus melangkah.",author:"— Inspirasi Perempuan Berdaya"},
  {text:"Setiap perempuan membawa cahaya tersendiri. Tugas kita adalah memastikan cahaya itu tidak pernah padam.",author:"— Comdev KOMIDA"},
  {text:"Pemberdayaan perempuan adalah investasi terbaik untuk masa depan keluarga dan bangsa.",author:"— Visi KOMIDA"},
  {text:"Ketika perempuan berdaya, seluruh keluarga ikut terangkat.",author:"— Program Comdev"},
  {text:"Literasi adalah kunci. Pengetahuan adalah bekal. Bersama kita melangkah lebih jauh.",author:"— Comdev KOMIDA"},
  {text:"Perempuan yang terdidik adalah pondasi peradaban yang kokoh.",author:"— Inspirasi Berdaya"},
  {text:"Tidak ada yang lebih indah dari melihat seorang ibu yang berdaya dan bahagia.",author:"— KOMIDA"},
];

// ─── STORAGE ─────────────────────────────────────────────────────────────────
// ─── FIREBASE REALTIME DATABASE REST API ─────────────────────────────────────
const FB_URL = "https://comdev-komida-default-rtdb.asia-southeast1.firebasedatabase.app";

async function fbGet(path) {
  try {
    const r = await fetch(`${FB_URL}/${path}.json`);
    return await r.json();
  } catch(e) { console.error('fbGet error:', e); return null; }
}
async function fbSet(path, data) {
  try {
    const r = await fetch(`${FB_URL}/${path}.json`, {
      method: 'PUT',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(data)
    });
    return await r.json();
  } catch(e) { console.error('fbSet error:', e); return null; }
}
async function fbPush(path, data) {
  try {
    const r = await fetch(`${FB_URL}/${path}.json`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(data)
    });
    return await r.json();
  } catch(e) { console.error('fbPush error:', e); return null; }
}
async function fbDelete(path) {
  try {
    await fetch(`${FB_URL}/${path}.json`, {method: 'DELETE'});
  } catch(e) { console.error('fbDelete error:', e); }
}

// ─── LOCAL STORAGE (sesi user) ───────────────────────────────────────────────
function load(key, def) {
  try { const s = localStorage.getItem(key); return s ? JSON.parse(s) : def; } catch { return def; }
}
function save(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch {}
}

// ─── APP STATE ────────────────────────────────────────────────────────────────
const state = {
  user: load('comdev_user', null),
  page: 'beranda',
  data: {modules:{},blogs:[],quizzes:[],ebooks:[]},
  notifications: [],
  counter: 0,
  loginLog: [],
  loading: true,
  modulView: 'list', activeModule: null, activeSub: null, activeMateri: null,
  blogView: 'list', activePost: null,
  quizView: 'list', activeQuiz: null, quizAnswers: {}, quizSubmitted: false, quizScore: null,
  forum: {},
  quoteIdx: new Date().getDay() % QUOTES.length,
};

// ─── INIT DATA dari Firebase ─────────────────────────────────────────────────
async function initData() {
  state.loading = true; render();
  try {
    const [blogs, quizzes, ebooks, modules, forum, loginlog] = await Promise.all([
      fbGet('blogs'), fbGet('quizzes'), fbGet('ebooks'),
      fbGet('modules'), fbGet('forum'), fbGet('loginlog'),
    ]);
    // blogs: {id: {...}, id2: {...}}
    state.data.blogs   = blogs   ? Object.entries(blogs).map(([k,v])=>({...v,_key:k}))   : [];
    state.data.quizzes = quizzes ? Object.entries(quizzes).map(([k,v])=>({...v,_key:k})) : [];
    state.data.ebooks  = ebooks  ? Object.entries(ebooks).map(([k,v])=>({...v,_key:k}))  : [];
    state.data.modules = modules || {};
    state.forum        = forum   || {};
    const logArr = loginlog ? Object.values(loginlog) : [];
    state.loginLog = logArr;
    state.counter  = logArr.length;
  } catch(e) { console.error('Init error:',e); }
  state.loading = false; render();
}
async function saveModules() {
  await fbSet('modules', state.data.modules);
}
async function recordLogin(user) {
  const waktu = new Date().toLocaleString('id-ID');
  const entry = {nama:user.name, role:user.role, waktu};
  state.loginLog.push(entry);
  state.counter = state.loginLog.length;
  fbPush('loginlog', entry);
}

function setState(patch) {
  Object.assign(state, patch);
  if ('user' in patch) save('comdev_user', state.user);
  render();
}

// ─── HELPERS ──────────────────────────────────────────────────────────────────
function el(tag, attrs, ...children) {
  const e = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs||{})) {
    if (k==='class') e.className=v;
    else if (k==='style' && typeof v==='object') Object.assign(e.style, v);
    else if (k.startsWith('on')) e.addEventListener(k.slice(2).toLowerCase(), v);
    else e.setAttribute(k, v);
  }
  for (const c of children) {
    if (c==null||c===false) continue;
    if (typeof c==='string'||typeof c==='number') e.appendChild(document.createTextNode(String(c)));
    else if (c instanceof Node) e.appendChild(c);
    else if (Array.isArray(c)) c.forEach(ci=>ci&&e.appendChild(typeof ci==='string'?document.createTextNode(ci):ci));
  }
  return e;
}

function modal(content, onClose) {
  const overlay = el('div', {class:'modal-overlay', onClick: e=>{ if(e.target===overlay) onClose(); }},
    el('div', {class:'modal', onClick: e=>e.stopPropagation()}, content)
  );
  document.body.appendChild(overlay);
  return overlay;
}

function removeModal(m) { if(m&&m.parentNode) m.parentNode.removeChild(m); }

// ─── SIDEBAR ─────────────────────────────────────────────────────────────────
function renderSidebar() {
  const {page, user} = state;
  const isAdmin = user && user.role==='comdev komida';
  const navItems = [
    {id:'beranda',icon:'🏠',label:'Beranda'},
    {id:'modul',icon:'📖',label:'Modul Literasi'},
    {id:'blog',icon:'✍️',label:'Blog & Narasi'},
    {id:'quiz',icon:'🧩',label:'Quiz'},
    {id:'ebook',icon:'📚',label:'E-Book'},
    ...(isAdmin?[{id:'admin',icon:'⚙️',label:'Admin Panel'}]:[]),
  ];
  const s = el('div',{id:'sidebar'});
  const logo = el('div',{class:'sidebar-logo'});
  logo.appendChild(el('div',{class:'label'},'Comdev'));
  logo.appendChild(el('h2',{},'KOMIDA'));
  logo.appendChild(el('div',{class:'sub'},'Selangkah Lebih Berdampak'));
  s.appendChild(logo);

  const nav = el('div',{class:'nav-area'});
  navItems.forEach(n=>{
    const btn = el('button',{class:'nav-btn'+(page===n.id?' active':''), onClick:()=>{
      setState({page:n.id,modulView:'list',blogView:'list',quizView:'list'});
      const sb=document.getElementById('sidebar'); const ov=document.getElementById('sidebar-overlay');
      if(sb) sb.classList.remove('open'); if(ov) ov.classList.remove('open');
    }},
      el('span',{class:'nav-icon'},n.icon), n.label
    );

  });
  s.appendChild(nav);

  const usr = el('div',{class:'sidebar-user'});
  usr.appendChild(el('div',{class:'login-as'},'Masuk sebagai'));

  usr.appendChild(el('button',{onClick:()=>setState({user:null,page:'beranda'})},'Keluar →'));
  s.appendChild(usr);
  return s;
}

// ─── PAGE: MODUL ─────────────────────────────────────────────────────────────
function renderModul() {
  const {modulView, activeModule, activeSub, activeMateri, data, notifications} = state;
  const isAdmin = state.user && state.user.role==='comdev komida';
  const allModules = data.modules||{};

  // ── MATERI DETAIL ──
  if(modulView==='materiDetail' && activeMateri){
    const key = `${activeModule}|${activeSub}|${activeMateri.id}`;
    const questions = state.forum[key]||[];
    const wrap = el('div',{class:'page-pad-narrow fade-in'});

    const bc = el('div',{class:'breadcrumb'});
    bc.appendChild(el('button',{class:'back-btn',onClick:()=>setState({modulView:'materi'})},'← Kembali'));
    bc.appendChild(el('span',{class:'bread-sep'},'|'));
    bc.appendChild(el('span',{class:'bread-text'},`${activeModule} › ${activeSub}`));
    wrap.appendChild(bc);

    const mcard = el('div',{class:'card',style:{marginBottom:'24px'}});
    mcard.appendChild(el('div',{style:{fontFamily:"'Cormorant Garamond',serif",fontSize:'26px',color:'var(--text1)',marginBottom:'8px'}},activeMateri.title));
    mcard.appendChild(el('div',{style:{fontSize:'11px',color:'var(--text3)',marginBottom:'16px'}},`📅 ${activeMateri.date}`));
    const content = el('div',{style:{fontSize:'14px',color:'var(--text2)',lineHeight:'1.9',whiteSpace:'pre-wrap'}});
    content.textContent = activeMateri.content||'';
    if(!activeMateri.content){
      const em = document.createElement('em'); em.style.color='var(--text3)';
      em.textContent='Konten materi belum ditambahkan.'; content.appendChild(em);
    }
    mcard.appendChild(content);
    wrap.appendChild(mcard);

    const fcard = el('div',{class:'card'});
    fcard.appendChild(el('div',{style:{fontFamily:"'Cormorant Garamond',serif",fontSize:'20px',color:'var(--green5)',marginBottom:'16px'}},'💬 Forum Diskusi'));

    let forumInput = '';
    const fi = el('input',{type:'text',placeholder:'Tulis pertanyaan atau komentar...',style:{flex:'1'}});
    fi.addEventListener('keydown',e=>{if(e.key==='Enter')postQuestion();});
    fi.addEventListener('input',()=>forumInput=fi.value);
    const sendBtn = el('button',{class:'btn-primary',onClick:()=>postQuestion()},'Kirim');
    fcard.appendChild(el('div',{class:'input-row'},fi,sendBtn));

    function postQuestion(){
      if(!fi.value.trim())return;
      const k = key;
      const q2 = {id:Date.now(),text:fi.value.trim(),date:new Date().toLocaleDateString('id-ID'),answers:[]};
      state.forum[k] = [...(state.forum[k]||[]), q2];
      state.notifications = [...state.notifications,{id:Date.now(),text:`Pertanyaan baru di "${activeMateri.title}": ${q2.text.slice(0,60)}...`}];
      fi.value='';
      fbSet('forum/'+encodeURIComponent(k).replace(/\./g,'%2E'), state.forum[k]);
      setState({});
    }

    const qlist = el('div');
    if(questions.length===0){
      qlist.appendChild(el('p',{style:{fontSize:'13px',color:'var(--text3)',textAlign:'center',padding:'20px 0'}},'Belum ada diskusi. Jadilah yang pertama bertanya!'));
    }
    questions.forEach(q2=>{
      const qi = el('div',{class:'forum-q'});
      qi.appendChild(el('div',{class:'forum-q-text'},q2.text));
      qi.appendChild(el('div',{class:'forum-q-date'},`📅 ${q2.date}`));
      q2.answers.forEach(a=>{
        const ad = el('div',{class:'forum-answer'});
        ad.innerHTML=`<strong style="color:var(--green5)">Admin: </strong>${a.text}`;
        qi.appendChild(ad);
      });
      if(isAdmin){
        let ansInput = '';
        const replyBtn = el('button',{style:{fontSize:'12px',color:'var(--green5)',background:'none',border:'none',cursor:'pointer'}},'Balas →');
        const replyForm = el('div',{style:{display:'none',flexDirection:'row',gap:'8px',marginTop:'8px'}});
        const ri = el('input',{type:'text',placeholder:'Tulis jawaban...',style:{flex:'1'}});
        ri.addEventListener('input',()=>ansInput=ri.value);
        const rb = el('button',{class:'btn-primary',style:{padding:'8px 16px',fontSize:'12px'},onClick:()=>{
          if(!ri.value.trim())return;
          const k2=key;
          state.forum[k2]=(state.forum[k2]||[]).map(qq=>qq.id===q2.id?{...qq,answers:[...qq.answers,{id:Date.now(),text:ri.value.trim(),date:new Date().toLocaleDateString('id-ID')}]}:qq);
          fbSet('forum/'+encodeURIComponent(k2).replace(/\./g,'%2E'), state.forum[k2]);
          setState({});
        }},'Kirim');
        replyBtn.onclick=()=>{replyForm.style.display='flex';};
        replyForm.appendChild(ri); replyForm.appendChild(rb);
        qi.appendChild(replyBtn); qi.appendChild(replyForm);
      }
      qlist.appendChild(qi);
    });
    fcard.appendChild(qlist);
    wrap.appendChild(fcard);
    return wrap;
  }

  // ── MATERI LIST ──
  if(modulView==='materi' && activeModule && activeSub){
    const materis = ((allModules[activeModule]||{}).subModuls||{})[activeSub]?.materis||[];
    const wrap = el('div',{class:'page-pad-narrow fade-in'});

    const bc = el('div',{class:'breadcrumb'});
    bc.appendChild(el('button',{class:'back-btn',onClick:()=>setState({modulView:'submodul'})},'← Kembali'));
    bc.appendChild(el('span',{class:'bread-sep'},'|'));
    bc.appendChild(el('span',{class:'bread-text'},`${activeModule} › ${activeSub}`));
    wrap.appendChild(bc);

    const hdr = el('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'20px'}});
    const htxt = el('div');
    htxt.appendChild(el('div',{style:{fontFamily:"'Cormorant Garamond',serif",fontSize:'26px',color:'var(--text1)'}},activeSub));
    htxt.appendChild(el('div',{style:{fontSize:'13px',color:'var(--text3)'}},`Sub Modul dari ${activeModule}`));
    hdr.appendChild(htxt);
    if(isAdmin){
      hdr.appendChild(el('button',{class:'btn-primary',onClick:showAddMateriModal},'+ Tambah Materi'));
    }
    wrap.appendChild(hdr);

    if(materis.length===0){
      const es = el('div',{style:{textAlign:'center',padding:'48px 0',color:'var(--text3)'}});
      es.appendChild(el('div',{class:'empty-icon'},'📄'));
      es.appendChild(el('p',{style:{fontSize:'14px'}},`Belum ada materi.${isAdmin?' Tambahkan materi pertama!':''}`));
      wrap.appendChild(es);
    }
    const list = el('div',{style:{display:'flex',flexDirection:'column',gap:'12px'}});
    materis.forEach(m=>{
      const mc = el('div',{class:'card materi-card'});
      const mcTop = el('div',{style:{cursor:'pointer'},onClick:()=>setState({activeMateri:m,modulView:'materiDetail'})});
      mcTop.appendChild(el('div',{class:'materi-title'},m.title));
      mcTop.appendChild(el('div',{class:'materi-date'},`📅 ${m.date}`));
      mcTop.appendChild(el('div',{class:'materi-excerpt'},m.content?m.content.slice(0,140)+(m.content.length>140?'...':''):'Belum ada konten'));
      mcTop.appendChild(el('div',{class:'read-more'},'Baca selengkapnya →'));
      mc.appendChild(mcTop);
      if(isAdmin){
        const mca = el('div',{class:'card-actions'});
        mca.appendChild(el('button',{class:'btn-danger',onClick:()=>{
          if(!confirm(`Hapus materi "${m.title}"?`)) return;
          state.data.modules[activeModule].subModuls[activeSub].materis =
            state.data.modules[activeModule].subModuls[activeSub].materis.filter(x=>x.id!==m.id);
          saveModules();
          setState({});
        }},'🗑 Hapus'));
        mc.appendChild(mca);
      }
      list.appendChild(mc);
    });
    wrap.appendChild(list);

    function showAddMateriModal(){
      let title='',content='';
      const m = modal([
        el('div',{style:{fontFamily:"'Cormorant Garamond',serif",fontSize:'22px',color:'var(--green5)',marginBottom:'16px'}},'Tambah Materi'),
        el('input',{type:'text',placeholder:'Judul materi...',style:{marginBottom:'12px'},onInput:e=>title=e.target.value}),
        el('textarea',{placeholder:'Isi konten materi...',rows:'8',style:{resize:'vertical',marginBottom:'16px'},onInput:e=>content=e.target.value}),
        el('div',{style:{display:'flex',gap:'10px'}},
          el('button',{class:'btn-primary',onClick:()=>{
            if(!title.trim())return;
            const newM={id:Date.now(),title,content,date:new Date().toLocaleDateString('id-ID')};
            if(!state.data.modules[activeModule]) state.data.modules[activeModule]={subModuls:{}};
            if(!state.data.modules[activeModule].subModuls[activeSub]) state.data.modules[activeModule].subModuls[activeSub]={materis:[]};
            state.data.modules[activeModule].subModuls[activeSub].materis.push(newM);
            removeModal(m);
            saveModules();
            setState({});
          }},'Simpan'),
          el('button',{class:'btn-secondary',onClick:()=>removeModal(m)},'Batal')
        )
      ], ()=>removeModal(m));
    }
    return wrap;
  }

  // ── SUB MODUL ──
  if(modulView==='submodul' && activeModule){
    const subModuls = ((allModules[activeModule]||{}).subModuls)||{};
    const wrap = el('div',{class:'page-pad-narrow fade-in'});

    const bc = el('div',{class:'breadcrumb'});
    bc.appendChild(el('button',{class:'back-btn',onClick:()=>setState({modulView:'list'})},'← Kembali'));
    bc.appendChild(el('span',{class:'bread-sep'},'|'));
    bc.appendChild(el('span',{class:'bread-text'},activeModule));
    wrap.appendChild(bc);

    const hdr = el('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'20px'}});
    const htxt = el('div');
    htxt.appendChild(el('div',{style:{fontFamily:"'Cormorant Garamond',serif",fontSize:'26px',color:'var(--text1)'}},`${MODULE_ICONS[activeModule]||'📂'} ${activeModule}`));
    htxt.appendChild(el('div',{style:{fontSize:'13px',color:'var(--text3)'}},'Pilih sub modul untuk melihat materi'));
    hdr.appendChild(htxt);
    if(isAdmin) hdr.appendChild(el('button',{class:'btn-primary',onClick:showAddSubModal},'+ Sub Modul'));
    wrap.appendChild(hdr);

    if(Object.keys(subModuls).length===0){
      const es = el('div',{style:{textAlign:'center',padding:'48px 0',color:'var(--text3)'}});
      es.appendChild(el('div',{class:'empty-icon'},'📂'));
      es.appendChild(el('p',{style:{fontSize:'14px'}},`Belum ada sub modul.${isAdmin?' Tambahkan sub modul pertama!':''}`));
      wrap.appendChild(es);
    }
    const grid = el('div',{class:'sub-grid'});
    Object.entries(subModuls).forEach(([name,sub])=>{
      const sc = el('div',{class:'card sub-card'});
      const scTop = el('div',{style:{cursor:'pointer'},onClick:()=>setState({activeSub:name,modulView:'materi'})});
      scTop.appendChild(el('div',{class:'sub-name'},name));
      scTop.appendChild(el('div',{class:'sub-count'},`${(sub.materis||[]).length} materi`));
      sc.appendChild(scTop);
      if(isAdmin){
        const sca = el('div',{class:'card-actions'});
        sca.appendChild(el('button',{class:'btn-danger',onClick:()=>{
          if(!confirm(`Hapus sub modul "${name}" beserta semua materinya?`)) return;
          delete state.data.modules[activeModule].subModuls[name];
          saveModules();
          setState({});
        }},'🗑 Hapus'));
        sc.appendChild(sca);
      }
      grid.appendChild(sc);
    });
    wrap.appendChild(grid);

    function showAddSubModal(){
      let subName='';
      const m = modal([
        el('div',{style:{fontFamily:"'Cormorant Garamond',serif",fontSize:'22px',color:'var(--green5)',marginBottom:'16px'}},'Tambah Sub Modul'),
        el('input',{type:'text',placeholder:'Nama sub modul...',style:{marginBottom:'16px'},onInput:e=>subName=e.target.value}),
        el('div',{style:{display:'flex',gap:'10px'}},
          el('button',{class:'btn-primary',onClick:()=>{
            if(!subName.trim())return;
            const nd={...state.data};
            if(!state.data.modules[activeModule]) state.data.modules[activeModule]={subModuls:{}};
            state.data.modules[activeModule].subModuls[subName]={materis:[]};
            removeModal(m);
            saveModules();
            setState({});
          }},'Tambah'),
          el('button',{class:'btn-secondary',onClick:()=>removeModal(m)},'Batal')
        )
      ], ()=>removeModal(m));
    }
    return wrap;
  }

  // ── MODULE LIST ──
  const wrap = el('div',{class:'page-pad fade-in'});
  const hdr = el('div',{class:'page-header'});
  const ht = el('div');
  ht.appendChild(el('div',{class:'page-title'},'Modul Literasi'));
  ht.appendChild(el('p',{class:'page-sub'},'Pilih modul untuk mulai belajar'));
  hdr.appendChild(ht);
  if(isAdmin) hdr.appendChild(el('button',{class:'btn-secondary',onClick:showAddModuleModal},'+ Modul Baru'));
  wrap.appendChild(hdr);

  const modList = [...MODULES, ...Object.keys(allModules).filter(k=>!MODULES.includes(k))];
  const grid = el('div',{class:'module-grid'});
  modList.forEach(mod=>{
    const subs = Object.keys(((allModules[mod]||{}).subModuls)||{});
    const mc = el('div',{class:'card mod-card',onClick:()=>setState({activeModule:mod,modulView:'submodul'})});
    mc.appendChild(el('div',{class:'mod-icon'},MODULE_ICONS[mod]||'📂'));
    mc.appendChild(el('div',{class:'mod-name'},mod));
    mc.appendChild(el('div',{class:'mod-count'},`${subs.length} sub modul`));
    grid.appendChild(mc);
  });
  wrap.appendChild(grid);

  function showAddModuleModal(){
    let mName='';
    const m = modal([
      el('div',{style:{fontFamily:"'Cormorant Garamond',serif",fontSize:'22px',color:'var(--green5)',marginBottom:'16px'}},'Tambah Modul Baru'),
      el('input',{type:'text',placeholder:'Nama modul...',style:{marginBottom:'16px'},onInput:e=>mName=e.target.value}),
      el('div',{style:{display:'flex',gap:'10px'}},
        el('button',{class:'btn-primary',onClick:()=>{
          if(!mName.trim())return;
          state.data.modules[mName]={subModuls:{}};
          removeModal(m);
          saveModules();
          setState({});
        }},'Tambah'),
        el('button',{class:'btn-secondary',onClick:()=>removeModal(m)},'Batal')
      )
    ], ()=>removeModal(m));
  }
  return wrap;
}

// ─── PAGE: QUIZ ───────────────────────────────────────────────────────────────
function renderQuiz(){
  const {quizView, activeQuiz, quizAnswers, quizSubmitted, quizScore, data} = state;
  const isAdmin = state.user && state.user.role==='comdev komida';
  const quizzes = data.quizzes||[];

  if(quizView==='take' && activeQuiz){
    const wrap = el('div',{class:'page-pad fade-in',style:{maxWidth:'680px'}});
    wrap.appendChild(el('button',{class:'back-btn',style:{marginBottom:'24px'},onClick:()=>setState({quizView:'list',quizSubmitted:false,quizAnswers:{},quizScore:null})},'← Kembali'));

    if(quizSubmitted){
      const sc = el('div',{class:'card',style:{textAlign:'center',padding:'48px 32px'}});
      sc.appendChild(el('div',{style:{fontSize:'56px',marginBottom:'16px'}},quizScore>=70?'🎉':'📝'));
      sc.appendChild(el('div',{style:{fontFamily:"'Cormorant Garamond',serif",fontSize:'32px',color:'var(--green5)',marginBottom:'8px'}},`Nilai Anda: ${quizScore}`));
      sc.appendChild(el('div',{style:{fontSize:'14px',color:'var(--text2)',marginBottom:'24px'}},
        quizScore>=80?'Luar biasa! Pemahaman Anda sangat baik.':quizScore>=60?'Bagus! Terus tingkatkan pembelajaran Anda.':'Jangan menyerah! Pelajari lagi materinya ya.'
      ));
      const rev = el('div',{style:{background:'var(--green1)',borderRadius:'12px',padding:'16px 24px',marginBottom:'20px'}});
      activeQuiz.questions.forEach((q,i)=>{
        const ri = el('div',{style:{textAlign:'left',marginBottom:'12px',borderBottom:i<activeQuiz.questions.length-1?'1px solid var(--green2)':'none',paddingBottom:'12px'}});
        ri.appendChild(el('div',{style:{fontSize:'13px',color:'var(--text1)',marginBottom:'4px'}},`${i+1}. ${q.text}`));
        const correct = quizAnswers[q.id]===q.correct;
        const ans = el('div',{style:{fontSize:'12px',color:correct?'var(--green5)':'#c0392b'}},`Jawaban Anda: ${q.options[quizAnswers[q.id]]||'-'}`);
        ri.appendChild(ans);
        if(!correct) ri.appendChild(el('span',{style:{fontSize:'12px',color:'var(--text3)',marginLeft:'8px'}},`| Benar: ${q.options[q.correct]}`));
        rev.appendChild(ri);
      });
      sc.appendChild(rev);
      sc.appendChild(el('button',{class:'btn-primary',onClick:()=>setState({quizSubmitted:false,quizAnswers:{},quizScore:null})},'Coba Lagi'));
      wrap.appendChild(sc);
    } else {
      wrap.appendChild(el('div',{style:{fontFamily:"'Cormorant Garamond',serif",fontSize:'26px',color:'var(--text1)',marginBottom:'4px'}},activeQuiz.title));
      wrap.appendChild(el('div',{style:{fontSize:'13px',color:'var(--text3)',marginBottom:'24px'}},`${activeQuiz.questions.length} pertanyaan · ${activeQuiz.category}`));
      activeQuiz.questions.forEach((q,i)=>{
        const qc = el('div',{class:'card',style:{marginBottom:'16px'}});
        qc.appendChild(el('div',{style:{fontSize:'14px',color:'var(--text1)',fontWeight:'500',marginBottom:'12px'}},`${i+1}. ${q.text}`));
        q.options.filter(o=>o.trim()).forEach((opt,oi)=>{
          const oDiv = el('div',{class:`quiz-option${quizAnswers[q.id]===oi?' selected':''}`,onClick:()=>{
            const newAns={...state.quizAnswers,[q.id]:oi};
            setState({quizAnswers:newAns});
          }});
          const radio = document.createElement('input'); radio.type='radio'; radio.name=`q-${q.id}`; radio.style.width='auto'; radio.style.margin='0'; radio.style.border='none'; radio.style.padding='0';
          radio.checked = quizAnswers[q.id]===oi;
          oDiv.appendChild(radio);
          oDiv.appendChild(el('span',{style:{fontSize:'13px',color:'var(--text2)'}},opt));
          qc.appendChild(oDiv);
        });
        wrap.appendChild(qc);
      });
      wrap.appendChild(el('button',{class:'btn-primary',style:{marginTop:'8px'},onClick:()=>{
        let correct=0;
        activeQuiz.questions.forEach(q=>{if(state.quizAnswers[q.id]===q.correct)correct++;});
        setState({quizScore:Math.round((correct/activeQuiz.questions.length)*100),quizSubmitted:true});
      }},'Kumpulkan Jawaban'));
    }
    return wrap;
  }

  const wrap = el('div',{class:'page-pad fade-in'});
  const hdr = el('div',{class:'page-header'});
  const ht = el('div');
  ht.appendChild(el('div',{class:'page-title'},'Quiz'));
  ht.appendChild(el('p',{class:'page-sub'},'Uji pemahaman Anda dari materi yang dipelajari'));
  hdr.appendChild(ht);
  if(isAdmin) hdr.appendChild(el('button',{class:'btn-primary',onClick:showQuizForm},'+ Buat Quiz'));
  wrap.appendChild(hdr);

  if(quizzes.length===0){
    const es = el('div',{class:'empty-state'});
    es.appendChild(el('div',{class:'empty-icon'},'🧩'));
    es.appendChild(el('p',{},`Belum ada quiz.${isAdmin?' Buat quiz pertama!':''}`));
    wrap.appendChild(es);
  }
  const grid = el('div',{class:'quiz-grid'});
  quizzes.forEach(qz=>{
    const qc = el('div',{class:'card quiz-card'});
    const qcTop = el('div',{style:{cursor:'pointer'},onClick:()=>setState({activeQuiz:qz,quizView:'take',quizSubmitted:false,quizAnswers:{},quizScore:null})});
    qcTop.appendChild(el('div',{style:{fontSize:'28px',marginBottom:'8px'}},'🧩'));
    if(qz.category) qcTop.appendChild(el('span',{class:'tag',style:{marginBottom:'8px',display:'inline-block'}},qz.category));
    qcTop.appendChild(el('div',{style:{fontFamily:"'Cormorant Garamond',serif",fontSize:'16px',color:'var(--text1)',marginBottom:'4px'}},qz.title));
    qcTop.appendChild(el('div',{style:{fontSize:'12px',color:'var(--text3)'}},`${qz.questions.length} pertanyaan · ${qz.date}`));
    qcTop.appendChild(el('div',{style:{marginTop:'12px',fontSize:'12px',color:'var(--green5)'}},'Mulai Quiz →'));
    qc.appendChild(qcTop);
    if(isAdmin){
      const qca = el('div',{class:'card-actions'});
      qca.appendChild(el('button',{class:'btn-danger',onClick:()=>{
        if(!confirm(`Hapus quiz "${qz.title}"?`)) return;
        state.data.quizzes = (state.data.quizzes||[]).filter(q=>q.id!==qz.id);
        if(qz._key) fbDelete('quizzes/'+qz._key);
        setState({});
      }},'🗑 Hapus'));
      qc.appendChild(qca);
    }
    grid.appendChild(qc);
  });
  wrap.appendChild(grid);

  function showQuizForm(){
    let form={title:'',category:'',questions:[]};
    let newQ={text:'',options:['','','',''],correct:0};
    const m = modal(buildQuizForm(), ()=>removeModal(m));

    function buildQuizForm(){
      const container = document.createElement('div');
      const rebuild = () => { while(container.firstChild) container.removeChild(container.firstChild); container.append(...buildQuizFormInner()); };

      function buildQuizFormInner(){
        const nodes=[];
        nodes.push(el('div',{style:{fontFamily:"'Cormorant Garamond',serif",fontSize:'22px',color:'var(--green5)',marginBottom:'16px'}},'Buat Quiz Baru'));
        const ti = el('input',{type:'text',placeholder:'Judul quiz...',style:{marginBottom:'10px'}});
        ti.value=form.title; ti.oninput=e=>form.title=e.target.value;
        nodes.push(ti);
        const ci = el('input',{type:'text',placeholder:'Kategori (misal: Keuangan, Kesehatan...)',style:{marginBottom:'16px'}});
        ci.value=form.category; ci.oninput=e=>form.category=e.target.value;
        nodes.push(ci);

        const qbox = el('div',{style:{background:'var(--green1)',borderRadius:'10px',padding:'14px',marginBottom:'16px'}});
        qbox.appendChild(el('div',{style:{fontSize:'13px',fontWeight:'500',color:'var(--text2)',marginBottom:'10px'}},'Tambah Pertanyaan'));
        const qi = el('input',{type:'text',placeholder:'Tulis pertanyaan...',style:{marginBottom:'8px'}});
        qi.value=newQ.text; qi.oninput=e=>newQ.text=e.target.value;
        qbox.appendChild(qi);
        ['A','B','C','D'].forEach((l,i)=>{
          const row = el('div',{style:{display:'flex',alignItems:'center',gap:'8px',marginBottom:'6px'}});
          const r = document.createElement('input'); r.type='radio'; r.name='qcorrect'; r.style.cssText='width:auto;margin:0;border:none;padding:0;'; r.checked=(newQ.correct===i); r.onchange=()=>newQ.correct=i;
          const oi = el('input',{type:'text',placeholder:`Pilihan ${l}`,style:{flex:'1'}});
          oi.value=newQ.options[i]; oi.oninput=e=>{const opts=[...newQ.options];opts[i]=e.target.value;newQ.options=opts;};
          row.appendChild(r); row.appendChild(oi);
          qbox.appendChild(row);
        });
        qbox.appendChild(el('div',{style:{fontSize:'11px',color:'var(--text3)',marginBottom:'10px'}},'* Centang radio untuk menandai jawaban benar'));
        qbox.appendChild(el('button',{class:'btn-secondary',style:{fontSize:'12px'},onClick:()=>{
          if(!newQ.text.trim())return;
          form.questions=[...form.questions,{...newQ,options:[...newQ.options],id:Date.now()}];
          newQ={text:'',options:['','','',''],correct:0}; rebuild();
        }},'+ Tambah ke Quiz'));
        nodes.push(qbox);

        if(form.questions.length>0){
          const ql = el('div',{style:{marginBottom:'16px'}});
          ql.appendChild(el('div',{style:{fontSize:'13px',color:'var(--text3)',marginBottom:'8px'}},`${form.questions.length} pertanyaan ditambahkan`));
          form.questions.forEach((q,i)=>ql.appendChild(el('div',{style:{fontSize:'12px',color:'var(--text2)',marginBottom:'4px'}},`${i+1}. ${q.text}`)));
          nodes.push(ql);
        }
        nodes.push(el('div',{style:{display:'flex',gap:'10px'}},
          el('button',{class:'btn-primary',onClick:()=>{
            if(!form.title.trim()||form.questions.length===0)return;
            const quiz={id:Date.now(),...form,date:new Date().toLocaleDateString('id-ID')};
            state.data.quizzes = [...(state.data.quizzes||[]), quiz];
            removeModal(m);
            setState({});
            fbPush('quizzes', quiz);
          }},'Simpan Quiz'),
          el('button',{class:'btn-secondary',onClick:()=>removeModal(m)},'Batal')
        ));
        return nodes;
      }
      container.append(...buildQuizFormInner());
      return container;
    }
    return m;
  }
  return wrap;
}

// ─── PAGE: ADMIN ─────────────────────────────────────────────────────────────
function renderAdmin(){
  const {data, notifications} = state;
  const blogs = data.blogs||[];
  const quizzes = data.quizzes||[];
  const ebooks = data.ebooks||[];
  const allMods = data.modules||{};
  const totalMaterials = Object.values(allMods).reduce((acc,m)=>
    acc+Object.values(m.subModuls||{}).reduce((a,s)=>a+(s.materis||[]).length,0),0);

  const wrap = el('div',{class:'page-pad fade-in'});
  wrap.appendChild(el('div',{style:{fontFamily:"'Cormorant Garamond',serif",fontSize:'30px',color:'var(--green5)',marginBottom:'4px'}},'Panel Admin'));
  wrap.appendChild(el('p',{style:{fontSize:'14px',color:'var(--text3)',marginBottom:'24px'}},'Kelola konten dan pantau aktivitas website'));

  // Counter card — dari login log
  const counterCard = el('div',{class:'stat-card',style:{background:'linear-gradient(135deg,var(--green1),var(--yellow1))',border:'1px solid var(--yellow3)'}});
  counterCard.appendChild(el('div',{class:'stat-icon'},'👥'));
  counterCard.appendChild(el('div',{class:'stat-val',style:{color:'var(--green5)'}}, state.counter.toLocaleString('id-ID')));
  counterCard.appendChild(el('div',{class:'stat-label'},'Total Login'));

  const stats = el('div',{class:'admin-stats'});
  stats.appendChild(counterCard);
  [
    {label:'Total Modul',val:Object.keys(allMods).length+MODULES.length,icon:'📖'},
    {label:'Total Materi',val:totalMaterials,icon:'📄'},
    {label:'Post Blog',val:blogs.length,icon:'✍️'},
    {label:'Quiz',val:quizzes.length,icon:'🧩'},
    {label:'E-Book',val:ebooks.length,icon:'📚'},
  ].forEach(s=>{
    const sc = el('div',{class:'stat-card'});
    sc.appendChild(el('div',{class:'stat-icon'},s.icon));
    sc.appendChild(el('div',{class:'stat-val'},String(s.val)));
    sc.appendChild(el('div',{class:'stat-label'},s.label));
    stats.appendChild(sc);
  });
  wrap.appendChild(stats);

  const nc = el('div',{class:'card'});
  const nh = el('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'16px'}});
  nh.appendChild(el('div',{style:{fontFamily:"'Cormorant Garamond',serif",fontSize:'20px',color:'var(--green5)'}},'🔔 Notifikasi Forum'));
  if(notifications.length>0){
    nh.appendChild(el('button',{class:'btn-secondary',style:{fontSize:'12px'},onClick:()=>setState({notifications:[]})},'Hapus Semua'));
  }
  nc.appendChild(nh);
  if(notifications.length===0){
    nc.appendChild(el('p',{style:{fontSize:'13px',color:'var(--text3)',textAlign:'center',padding:'20px 0'}},'Belum ada notifikasi baru'));
  } else {
    [...notifications].reverse().forEach(n=>{
      const ni = el('div',{class:'notif-item'});
      ni.appendChild(el('span',{style:{fontSize:'16px'}},'💬'));
      ni.appendChild(el('p',{style:{fontSize:'13px',color:'var(--text2)',lineHeight:'1.6'}},n.text));
      nc.appendChild(ni);
    });
  }
  wrap.appendChild(nc);

  // Tabel log login
  const logCard = el('div',{class:'card',style:{marginTop:'20px'}});
  const logHeader = el('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'16px'}});
  logHeader.appendChild(el('div',{style:{fontFamily:"'Cormorant Garamond',serif",fontSize:'20px',color:'var(--green5)'}},'👤 Riwayat Login'));
  const clearBtn = el('button',{class:'btn-secondary',style:{fontSize:'12px'},onClick:()=>{
    if(!confirm('Hapus semua riwayat login?')) return;
    state.loginLog=[]; state.counter=0;
    render();
  }},'Hapus Semua');
  logHeader.appendChild(clearBtn);
  logCard.appendChild(logHeader);

  const log = state.loginLog;
  if(log.length === 0){
    logCard.appendChild(el('p',{style:{fontSize:'13px',color:'var(--text3)',textAlign:'center',padding:'20px 0'}},'Belum ada riwayat login.'));
  } else {
    const tbl = document.createElement('table');
    tbl.style.cssText = 'width:100%;border-collapse:collapse;font-size:13px;';
    const thead = tbl.createTHead();
    const hr = thead.insertRow();
    ['No','Nama','Role','Waktu'].forEach(h=>{
      const th = document.createElement('th');
      th.textContent = h;
      th.style.cssText = 'text-align:left;padding:8px 10px;border-bottom:2px solid var(--green2);color:var(--green5);font-weight:500;font-size:12px;';
      hr.appendChild(th);
    });
    const tbody = tbl.createTBody();
    [...log].reverse().forEach((entry, i)=>{
      const tr = tbody.insertRow();
      tr.style.borderBottom = '1px solid var(--green1)';
      // pakai nama/role dari Google Sheets (field: nama, role, waktu)
      [log.length - i, entry.nama||entry.name||'-', entry.role||'-', entry.waktu||'-'].forEach(val=>{
        const td = tr.insertCell();
        td.textContent = val;
        td.style.cssText = 'padding:8px 10px;color:var(--text2);text-transform:capitalize;';
      });
    });
    logCard.appendChild(tbl);
  }
  wrap.appendChild(logCard);

  return wrap;
}

// ─── LANDING PAGE ─────────────────────────────────────────────────────────────
function renderLanding(){
  const root = el('div',{id:'landing'});

  root.appendChild(el('div',{class:'landing-counter'},
    `👥 Sudah `, el('strong',{style:{color:'var(--green5)'}}, state.counter.toLocaleString('id-ID')), ` orang yang mengakses website ini`
  ));

  const body = el('div',{class:'landing-body'});
  const grid = el('div',{class:'landing-grid'});

  // Left
  const left = el('div');
  left.appendChild(el('div',{style:{fontSize:'11px',color:'var(--green4)',letterSpacing:'2px',textTransform:'uppercase',marginBottom:'12px'}},'Koperasi Mitra Dhuafa'));
  const h1 = el('h1',{class:'landing-title'});
  h1.innerHTML='Comdev<br><span style="color:var(--green5)">KOMIDA</span>';
  left.appendChild(h1);
  left.appendChild(el('div',{style:{fontFamily:"'Cormorant Garamond',serif",fontSize:'18px',color:'var(--text3)',fontStyle:'italic',marginBottom:'24px'}},'Selangkah Lebih Berdampak'));
  left.appendChild(el('p',{class:'landing-desc'},'Platform literasi dan pemberdayaan untuk anggota, staf, dan Community Development KOMIDA. Bersama kita tingkatkan kualitas hidup perempuan Indonesia.'));
  const ltags = el('div',{class:'landing-tags'});
  ["Modul Literasi","Forum Diskusi","Blog","Quiz","E-Book"].forEach(t=>ltags.appendChild(el('span',{class:'landing-tag'},t)));
  left.appendChild(ltags);
  grid.appendChild(left);

  // Right: login form
  const rbox = el('div',{class:'login-box'});
  rbox.appendChild(el('h3',{},'Selamat Datang'));
  rbox.appendChild(el('p',{},'Masukkan nama dan pilih kategori Anda'));

  // Name input
  const nameWrap = el('div',{style:{marginBottom:'14px'}});
  nameWrap.appendChild(el('label',{class:'form-label'},'Nama Lengkap'));
  const nameInput = el('input',{type:'text',placeholder:'Masukkan nama Anda...'});
  nameWrap.appendChild(nameInput);
  rbox.appendChild(nameWrap);

  // Role selection
  const roleWrap = el('div',{style:{marginBottom:'14px'}});
  roleWrap.appendChild(el('label',{class:'form-label'},'Kategori Pengguna'));
  const roles = ['anggota komida','staf komida','comdev komida'];
  let selectedRole = '';
  const roleOptions = [];
  const passWrap = el('div',{style:{marginBottom:'14px',display:'none'}});
  passWrap.appendChild(el('label',{class:'form-label'},'Password Admin'));
  const passInput = el('input',{type:'password',placeholder:'Masukkan password...'});
  passWrap.appendChild(passInput);

  roles.forEach(r=>{
    const lbl = el('label',{class:'role-option'});
    const radio = document.createElement('input'); radio.type='radio'; radio.name='role'; radio.value=r;
    radio.style.cssText='width:auto;margin:0;border:none;padding:0;';
    radio.onchange=()=>{
      selectedRole=r; errorBox.style.display='none';
      roleOptions.forEach(o=>{o.el.classList.toggle('selected',o.r===r);});
      passWrap.style.display=(r==='comdev komida')?'block':'none';
    };
    lbl.appendChild(radio);
    lbl.appendChild(el('span',{},r));
    roleOptions.push({el:lbl,r});
    roleWrap.appendChild(lbl);
  });
  rbox.appendChild(roleWrap);
  rbox.appendChild(passWrap);

  const errorBox = el('div',{class:'error-box',style:{display:'none'}});
  rbox.appendChild(errorBox);

  const loginBtn = el('button',{class:'btn-primary',style:{width:'100%',padding:'12px',fontSize:'14px'},
    onClick:doLogin},'Masuk ke Platform →');
  rbox.appendChild(loginBtn);

  function doLogin(){
    const name=nameInput.value.trim();
    if(!name){errorBox.textContent='Masukkan nama Anda';errorBox.style.display='block';return;}
    if(!selectedRole){errorBox.textContent='Pilih kategori pengguna';errorBox.style.display='block';return;}
    if(selectedRole==='comdev komida'&&passInput.value!=='perempuanberdaya'){
      errorBox.textContent='Password salah. Coba lagi.';errorBox.style.display='block';return;}
    const newUser = {name, role: selectedRole};
    setState({user: newUser, page:'beranda'});
    recordLogin(newUser); // async, tidak perlu await
  }
  nameInput.addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
  passInput.addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});

  grid.appendChild(rbox);
  body.appendChild(grid);
  root.appendChild(body);
  root.appendChild(el('div',{class:'landing-footer'},'© 2025 Comdev KOMIDA · Koperasi Mitra Dhuafa · Selangkah Lebih Berdampak 🌿'));
  return root;
}

// ─── MAIN RENDER ─────────────────────────────────────────────────────────────
function render(){
  const root = document.getElementById('root');
  while(root.firstChild) root.removeChild(root.firstChild);

  // Loading screen saat fetch data awal
  if(state.loading){
    const ld = document.createElement('div');
    ld.style.cssText='min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--cream);gap:16px;';
    ld.innerHTML='<div style="font-size:48px">🌿</div><div style="font-family:Cormorant Garamond,serif;font-size:24px;color:var(--green5)">Memuat data...</div><div style="font-size:13px;color:var(--text3)">Menghubungkan ke database</div>';
    root.appendChild(ld);
    return;
  }

  if(!state.user){
    root.appendChild(renderLanding());
    return;
  }

  const app = el('div',{id:'app'});
  app.appendChild(renderSidebar());

  // Overlay untuk mobile sidebar
  const overlay = el('div',{id:'sidebar-overlay',onClick:toggleSidebar});
  app.appendChild(overlay);

  const main = el('div',{id:'main'});
  main.appendChild(renderTopbar());

  const pageContent = el('div',{id:'page-content'});
  let pageEl;
  switch(state.page){
    case 'beranda': pageEl=renderBeranda(); break;
    case 'modul':   pageEl=renderModul();  break;
    case 'blog':    pageEl=renderBlog();   break;
    case 'quiz':    pageEl=renderQuiz();   break;
    case 'ebook':   pageEl=renderEbook();  break;
    case 'admin':   pageEl=(state.user.role==='comdev komida'?renderAdmin():renderBeranda()); break;
    default:        pageEl=renderBeranda();
  }
  pageContent.appendChild(pageEl);
  main.appendChild(pageContent);
  app.appendChild(main);
  root.appendChild(app);
}

initData();
</script>
</body>
</html>
